# ----------------------------------------------------------------------------
# failure-agent-teams-bot — Weekly trends digest
#
# Scheduled weekly pipeline that aggregates the failure-analysis artifacts from
# the last N days of E2E runs, has the failure-agent (Azure OpenAI) synthesize a
# trends digest, and posts one Adaptive Card to the shared ACN Pipeline Notifier
# bot. Unlike the per-run incident card, this weekly card @mentions the
# failure-analysis owners (see scripts/notify-weekly.sh).
#
# BEFORE THIS RUNS you MUST fill in:
#   1. pipeline-constants.yml → notifyTeamId, notifyChannelId
#   2. parameters.analysisPipelineIds → the ADO build-definition id(s) whose
#      failureAnalysis_* artifacts should be aggregated (comma-separated).
#   3. The AzureCLI@2 azureSubscription below → your WIF service connection.
#   4. Enable "Allow scripts to access the OAuth token" so SYSTEM_ACCESSTOKEN is
#      available for the artifact-aggregation REST calls.
#   5. Azure OpenAI variables (AZURE_OPENAI_*) available to the analysis step.
#
# Requirements on the agent: Go, Azure CLI, jq, curl, unzip.
# ----------------------------------------------------------------------------

pr: none
trigger: none

schedules:
  - cron: "0 15 * * 1"           # Mondays 15:00 UTC
    displayName: "Weekly FAA trends digest"
    branches:
      include:
        - master
    always: true

parameters:
  # ADO build-definition id(s) whose failureAnalysis_* artifacts are aggregated.
  # Comma-separated. Empty = the aggregation step is a quiet no-op.
  - name: analysisPipelineIds
    type: string
    default: ""
  - name: windowDays
    type: string
    default: "7"

variables:
  - template: pipeline-constants.yml
  - name: serviceConnection
    value: acn-dalec-test

stages:
  - stage: weekly
    displayName: "Weekly FAA trends"
    jobs:
      - job: digest
        displayName: "Aggregate + synthesize + notify"
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        variables:
          - name: weeklyEvidence
            value: $(Agent.TempDirectory)/weekly-evidence
          - name: weeklyOutput
            value: $(Agent.TempDirectory)/weekly-out
        steps:
          - checkout: self

          - task: GoTool@0
            displayName: "Setup Go"
            inputs:
              version: '1.25'

          # --- Aggregate the week's failure-analysis artifacts ----------------
          - bash: |
              set -euo pipefail
              mkdir -p "$(weeklyEvidence)"
              bash "$(Build.SourcesDirectory)/.pipelines/failure-agent-teams-bot/scripts/collect-week-artifacts.sh" \
                "$(weeklyEvidence)" \
                "${{ parameters.windowDays }}" \
                "${{ parameters.analysisPipelineIds }}"
            displayName: "Collect week's analysis artifacts"
            env:
              SYSTEM_COLLECTIONURI: $(System.CollectionUri)
              SYSTEM_TEAMPROJECT: $(System.TeamProject)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

          # --- Synthesize the weekly trends digest ----------------------------
          - script: |
              set -euo pipefail
              mkdir -p "$(weeklyOutput)"
              if [ -z "${AZURE_OPENAI_ENDPOINT:-}" ] || [ -z "${AZURE_OPENAI_DEPLOYMENT:-}" ]; then
                echo "##[warning]Azure OpenAI credentials not configured; the weekly digest will fall back to a deterministic stats-only summary."
              fi
              cd "$(Build.SourcesDirectory)/tools/failure-agent"
              go run . \
                --weekly-report "$(weeklyEvidence)" \
                --output "$(weeklyOutput)" \
                --weekly-window-days "${{ parameters.windowDays }}"
            displayName: "Synthesize weekly trends"
            env:
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
              AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
              AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
              AZURE_OPENAI_API_VERSION: $(AZURE_OPENAI_API_VERSION)

          - script: |
              set -euo pipefail
              REPORT="$(weeklyOutput)/weekly-report.md"
              if [ -f "$REPORT" ]; then
                echo "##vso[task.uploadsummary]$REPORT"
              fi
            displayName: "Publish weekly summary"
            condition: succeededOrFailed()

          # --- Post the weekly card (mentions the FAA owners) -----------------
          - task: AzureCLI@2
            displayName: "Notify Teams — weekly trends"
            condition: succeededOrFailed()
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                bash "$(Build.SourcesDirectory)/.pipelines/failure-agent-teams-bot/scripts/notify-weekly.sh" \
                  "$(weeklyOutput)/weekly-incident.json"
            env:
              NOTIFIER_ENDPOINT: $(notifierEndpoint)
              NOTIFIER_API_AUDIENCE: $(notifierApiAudience)
              NOTIFY_SOURCE: $(notifySource)-weekly
              NOTIFY_RUN_ID: $(Build.BuildId)
              NOTIFY_TEAM_ID: $(notifyTeamId)
              NOTIFY_CHANNEL_ID: $(notifyChannelId)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
