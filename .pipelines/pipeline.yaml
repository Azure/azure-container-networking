pr:
  branches:
    include:
      - master
      - release/*
  paths:
    exclude:
      - ".devcontainer"
      - ".hooks"
      - ".vscode"
      - ".github"
      - docs

trigger:
  branches:
    include:
      - gh-readonly-queue/master/*
      - gh-readonly-queue/release/*
  tags:
    include:
      - "*"

schedules:
- cron: "0 2 * * *" # Every day at 2am
  displayName: "Official Nightly Pipeline"
  branches:
    include: ["master"]
  always: true
- cron: "0 11,15,19,23 * * *" # 4 runs/day at 11,15,19,23 UTC; avoids the midnight janitor window
  displayName: "Scheduled Failure Analysis Agent Run"
  branches:
    include: ["master"]
  always: true

parameters:
  - name: testBundle
    type: string
    default: full
    values:
      - full
      - images
  # Empty or __use-default__ builds and publishes the component image.
  # A supplied image skips those entries and is used by the install path.
  - name: cniImage
    type: string
    default: "__use-default__"
  - name: cnsImage
    type: string
    default: "__use-default__"
  - name: ipamImage
    type: string
    default: "__use-default__"
  - name: azureIptablesMonitorImage
    type: string
    default: "__use-default__"
  - name: azureIpMasqMergerImage
    type: string
    default: "__use-default__"
  - name: ciliumLogCollectorImage
    type: string
    default: "__use-default__"
  - name: ipv6HpBpfImage
    type: string
    default: "__use-default__"
  # Optional build-number prefix to differentiate DALEC release runs.
  # Applied in setup only when the value contains "dalec".
  - name: runNamePrefix
    type: string
    default: "__use-default__"

variables:
  BUILD_POOL_NAME_DEFAULT: $(BUILD_POOL_1ESPT_AMD)
  BUILD_POOL_NAME_LINUX_AMD64: $(BUILD_POOL_1ESPT_AMD)
  BUILD_POOL_NAME_LINUX_ARM64: $(BUILD_POOL_1ESPT_ARM)

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

# Extend a governed 1ES Pipeline Template so the downstream release pipeline can
# verify which template produced this build's artifacts. This pipeline is marked
# Production in the 1ES Product Catalog because the release pipeline ships its
# artifacts, so it must extend Official on every branch, not just release refs.
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    # Agent for the compliance jobs 1ES injects. `os` is explicit because the pool
    # is a variable, so 1ES can't resolve the OS when it compiles the template.
    pool:
      name: $(BUILD_POOL_NAME_DEFAULT)
      os: linux

    # Guardian source analysis is Windows-only, and the pool above is Linux.
    sdl:
      sourceAnalysisPool:
        name: $(BUILD_POOL_NAME_DEFAULT_WINDOWS_ALT)
        os: windows

    stages:
      - stage: setup
        displayName: ACN
        jobs:
          - job: env
            displayName: Setup
            pool:
              name: "$(BUILD_POOL_NAME_DEFAULT)"
              os: linux
            variables:
              prTargetBranch: $[ variables['System.PullRequest.TargetBranchName'] ]
            steps:
              - template: /.pipelines/templates/git-diff-check.yaml@self
              - bash: python3 hack/scripts/validate_image_bundle.py
                displayName: Validate image inputs
                env:
                  TEST_BUNDLE: ${{ parameters.testBundle }}
                  IMAGES: >-
                    {"cni": "${{ parameters.cniImage }}", "cns": "${{ parameters.cnsImage }}", "azure-ipam": "${{ parameters.ipamImage }}", "azure-iptables-monitor": "${{ parameters.azureIptablesMonitorImage }}", "azure-ip-masq-merger": "${{ parameters.azureIpMasqMergerImage }}", "cilium-log-collector": "${{ parameters.ciliumLogCollectorImage }}", "ipv6-hp-bpf": "${{ parameters.ipv6HpBpfImage }}"}
              - script: |
                  # To use the variables below, you must make the respective stage's dependsOn have - setup or it will not retain context of this stage
                  CUSTOM_RUN_NAME_PREFIX="${{ parameters.runNamePrefix }}"
                  if [ -n "$CUSTOM_RUN_NAME_PREFIX" ] && [[ "${CUSTOM_RUN_NAME_PREFIX,,}" == *dalec* ]]; then
                    BUILD_REV="$(Build.BuildNumber)"
                    BUILD_REV="${BUILD_REV##*.}"
                    RUN_DATE="$(date +%Y%m%d)"
                    echo "##vso[build.updatebuildnumber]${CUSTOM_RUN_NAME_PREFIX}-${RUN_DATE}.${BUILD_REV}"
                  fi

                  BUILD_NUMBER=$(Build.BuildNumber)
                  echo "##vso[task.setvariable variable=StorageID;isOutput=true]$(echo ${BUILD_NUMBER//./-})"
                  echo "##vso[task.setvariable variable=commitID;isOutput=true]$(echo $(make revision)-$(date "+%d%H%M"))"
                  echo "##vso[task.setvariable variable=Tag;isOutput=true]$(make version)"
                  echo "##vso[task.setvariable variable=npmVersion;isOutput=true]$(make npm-version)"
                  echo "##vso[task.setvariable variable=imageRepositoryPath;isOutput=true]acnpublic.azurecr.io"
                  echo "##vso[task.setvariable variable=cnsImagePrefix;isOutput=true]azure-"

                  # Shared parser for component image override inputs.
                  . ./hack/scripts/parse_override_image.sh

                  read -r CNI_REPO CNI_NAME CNI_VERSION <<< "$(parse_override_image '${{ parameters.cniImage }}' azure-cni $(make cni-version))"
                  read -r CNS_REPO CNS_NAME CNS_VERSION <<< "$(parse_override_image '${{ parameters.cnsImage }}' azure-cns $(make cns-version))"
                  read -r IPAM_REPO IPAM_NAME IPAM_VERSION <<< "$(parse_override_image '${{ parameters.ipamImage }}' azure-ipam $(make azure-ipam-version))"

                  echo "##vso[task.setvariable variable=cniImageRepo;isOutput=true]${CNI_REPO}"
                  echo "##vso[task.setvariable variable=cniImageNameOverride;isOutput=true]${CNI_NAME}"
                  echo "##vso[task.setvariable variable=cniVersion;isOutput=true]${CNI_VERSION}"

                  # Example (CNS):
                  # cnsImage="__use-default__" -> cnsImageRepo=ACN, cnsImageNameOverride=azure-cns,
                  # cnsVersion=<make cns-version>
                  # cnsImage="mcr.microsoft.com/containernetworking/azure-cns:v1.2.3" ->
                  # cnsImageRepo=MCR, cnsImageNameOverride=azure-cns, cnsVersion=v1.2.3
                  echo "##vso[task.setvariable variable=cnsImageRepo;isOutput=true]${CNS_REPO}"
                  echo "##vso[task.setvariable variable=cnsImageNameOverride;isOutput=true]${CNS_NAME}"
                  echo "##vso[task.setvariable variable=cnsVersion;isOutput=true]${CNS_VERSION}"

                  echo "##vso[task.setvariable variable=ipamImageRepo;isOutput=true]${IPAM_REPO}"
                  echo "##vso[task.setvariable variable=ipamImageNameOverride;isOutput=true]${IPAM_NAME}"
                  echo "##vso[task.setvariable variable=ipamVersion;isOutput=true]${IPAM_VERSION}"

                  echo "##vso[task.setvariable variable=azureIptablesMonitorImageOverride;isOutput=true]$(resolve_override_image '${{ parameters.azureIptablesMonitorImage }}' azure-iptables-monitor $(make azure-iptables-monitor-version))"
                  echo "##vso[task.setvariable variable=azureIpMasqMergerImageOverride;isOutput=true]$(resolve_override_image '${{ parameters.azureIpMasqMergerImage }}' azure-ip-masq-merger $(make azure-ip-masq-merger-version))"
                  echo "##vso[task.setvariable variable=ciliumLogCollectorImageOverride;isOutput=true]$(resolve_override_image '${{ parameters.ciliumLogCollectorImage }}' cilium-log-collector $(make cilium-log-collector-version))"

                  IPV6_HP_BPF_IMAGE_OVERRIDE=""
                  if [ -n "$IPV6_HP_BPF_IMAGE_PARAMETER" ] && [ "$IPV6_HP_BPF_IMAGE_PARAMETER" != "__use-default__" ]; then
                    IPV6_HP_BPF_IMAGE_OVERRIDE="$(resolve_override_image "$IPV6_HP_BPF_IMAGE_PARAMETER" ipv6-hp-bpf "$(make ipv6-hp-bpf-version)")"
                  fi
                  echo "##vso[task.setvariable variable=ipv6HpBpfImageOverride;isOutput=true]${IPV6_HP_BPF_IMAGE_OVERRIDE}"

                  cat /etc/os-release
                  uname -a
                  sudo chown -R $(whoami):$(whoami) .
                  go version
                  go env
                  which go
                  echo $PATH
                  echo "------"
                  echo "$(Build.QueuedBy)"
                  echo $(Build.Reason) # manual, PR, IndividualCI
                  echo $(Build.SourceBranch)
                  echo $(System.PullRequest.TargetBranch)
                  echo $(System.PullRequest.targetBranchName)
                name: "EnvironmentalVariables"
                displayName: "Set environmental variables"
                env:
                  IPV6_HP_BPF_IMAGE_PARAMETER: ${{ parameters.ipv6HpBpfImage }}
                condition: always()

      - template: /.pipelines/templates/run-unit-tests.yaml@self

      - ${{ if or(eq(parameters.testBundle, 'images'), not(contains(variables['Build.SourceBranch'], 'refs/pull'))) }}:
        - template: /.pipelines/templates/image-bundle.stages.yaml@self
          parameters:
            testBundle: ${{ parameters.testBundle }}
            images:
              cni: ${{ parameters.cniImage }}
              cns: ${{ parameters.cnsImage }}
              azure-ipam: ${{ parameters.ipamImage }}
              azure-iptables-monitor: ${{ parameters.azureIptablesMonitorImage }}
              azure-ip-masq-merger: ${{ parameters.azureIpMasqMergerImage }}
              cilium-log-collector: ${{ parameters.ciliumLogCollectorImage }}
              ipv6-hp-bpf: ${{ parameters.ipv6HpBpfImage }}
