trigger: none
pr: none

variables:
  BUILD_POOL_NAME_DEFAULT: $(BUILD_POOL_1ESPT_AMD)
  BUILD_POOL_NAME_LINUX_AMD64: $(BUILD_POOL_1ESPT_AMD)
  BUILD_POOL_NAME_LINUX_ARM64: $(BUILD_POOL_1ESPT_ARM)

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: $(BUILD_POOL_NAME_DEFAULT)
      os: linux
    sdl:
      sourceAnalysisPool:
        name: $(BUILD_POOL_NAME_DEFAULT_WINDOWS_ALT)
        os: windows
    stages:
      - stage: arm_pool_diagnostics
        displayName: Read-only working ARM pool diagnostics
        jobs:
          - job: inspect_docker_access
            displayName: Inspect agent groups and Docker socket
            timeoutInMinutes: 10
            cancelTimeoutInMinutes: 1
            pool:
              name: $(BUILD_POOL_NAME_LINUX_ARM64)
              os: linux
            steps:
              - checkout: none
              - bash: |
                  set -uo pipefail

                  LAST_RC=0
                  run() {
                    printf '\n=== '
                    printf '%q ' "$@"
                    printf '===\n'
                    "$@"
                    LAST_RC=$?
                    printf '\nexit_code=%s\n' "$LAST_RC"
                  }

                  run date -u
                  run uname -a
                  run cat /etc/os-release
                  run whoami
                  run id
                  run id cloudtest
                  run getent passwd cloudtest
                  run getent group docker
                  run grep -E '^(Name|Pid|PPid|Uid|Gid|Groups):' /proc/self/status
                  for pid in "$$" "$PPID"; do
                    run grep -E '^(Name|Pid|PPid|Uid|Gid|Groups):' "/proc/$pid/status"
                  done
                  run ps -C Agent.Listener,Agent.Worker -o pid,ppid,user:32,group:32,supgrp:256,comm

                  run stat -c '%A %a %U:%G %u:%g %n' /var/run/docker.sock
                  run stat -c '%y %n' /etc/passwd /etc/group /var/run/docker.sock
                  run namei -l /var/run/docker.sock
                  run readlink -f /var/run/docker.sock
                  run getfacl --absolute-names /var/run/docker.sock
                  run command -v docker
                  run docker context show
                  run docker context inspect --format '{{json .Endpoints.docker.Host}}'
                  run docker version
                  run docker info
                  USER_DOCKER_RC=$LAST_RC
                  run sudo -n docker info
                  ROOT_DOCKER_RC=$LAST_RC

                  run systemctl cat docker.service docker.socket
                  run systemctl show docker.socket -p FragmentPath -p DropInPaths -p SocketMode -p SocketUser -p SocketGroup
                  run systemctl show docker.service -p MainPID -p FragmentPath -p DropInPaths -p ExecMainStartTimestamp
                  run systemctl show 'vsts.agent*' -p Id -p User -p Group -p SupplementaryGroups -p FragmentPath -p DropInPaths
                  run sudo -n journalctl -b -u docker.service -u docker.socket --no-pager -n 100
                  run sudo -n journalctl -b -t usermod -t groupadd -t gpasswd -t useradd --no-pager -n 100
                  run sudo -n journalctl -b -t usermod -t groupadd -t gpasswd -t useradd --no-pager -n 100 -o json --output-fields=__REALTIME_TIMESTAMP,_SYSTEMD_UNIT,_SYSTEMD_CGROUP,_EXE,_COMM,_PID,_UID,_AUDIT_LOGINUID,_AUDIT_SESSION,SYSLOG_IDENTIFIER,MESSAGE
                  run systemctl show cloud-init.service cloud-config.service cloud-final.service waagent.service walinuxagent.service -p Id -p FragmentPath -p DropInPaths -p User -p Group
                  run sudo -n cloud-init query merged_cfg.system_info.distro
                  run sudo -n cloud-init query merged_cfg.system_info.default_user.name
                  run sudo -n cloud-init query merged_cfg.system_info.default_user.groups
                  run sudo -n python3 - <<'PY'
                  import glob
                  import json
                  from pathlib import Path
                  import yaml

                  for name in ["/etc/cloud/cloud.cfg"] + sorted(glob.glob("/etc/cloud/cloud.cfg.d/*.cfg")):
                      path = Path(name)
                      if not path.exists():
                          print(json.dumps({"file": name, "status": "missing"}))
                          continue
                      config = yaml.safe_load(path.read_text())
                      if not isinstance(config, dict):
                          print(json.dumps({"file": name, "status": "no mapping"}))
                          continue
                      default_user = config.get("system_info", {}).get("default_user", {})
                      users = config.get("users", [])
                      print(json.dumps({
                          "file": name,
                          "default_user": {k: default_user[k] for k in ("name", "groups", "primary_group") if k in default_user},
                          "users": [
                              {k: user[k] for k in ("name", "groups", "primary_group") if k in user}
                              if isinstance(user, dict) else user
                              for user in users
                          ],
                          "groups": config.get("groups"),
                      }))
                  PY
                  run grep -n -E '^(GROUP|GROUPS|USERGROUPS_ENAB)' /etc/default/useradd /etc/login.defs
                  run sudo -n grep -R -n -E 'cloudtest|docker' /etc/sysusers.d /usr/lib/sysusers.d /etc/tmpfiles.d /usr/lib/tmpfiles.d

                  if command -v rpm >/dev/null 2>&1; then
                    run rpm -q moby-engine moby-cli docker-ce docker-ce-cli
                    run rpm -q cloud-init WALinuxAgent waagent shadow-utils
                    run rpm -q --scripts moby-engine
                    run rpm -qf /usr/lib/systemd/system/docker.service /usr/lib/systemd/system/docker.socket
                  else
                    run dpkg-query -W docker-ce docker-ce-cli containerd.io
                  fi

                  printf '\n=== DIAGNOSTIC RESULT ===\n'
                  printf 'agent_user_docker_info_exit_code=%s\n' "$USER_DOCKER_RC"
                  printf 'root_docker_info_exit_code=%s\n' "$ROOT_DOCKER_RC"
                  if [ "$USER_DOCKER_RC" -ne 0 ]; then
                    printf 'FAIL: Docker access fails as the agent user; preceding output preserves the evidence.\n'
                    exit 1
                  fi
                  printf 'PASS: Docker access succeeds as the agent user on this allocation.\n'
                displayName: Collect read-only Docker access and permission provenance
                timeoutInMinutes: 5
