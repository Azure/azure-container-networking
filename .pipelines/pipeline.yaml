pr:
  branches:
    include:
      - master
      - release/*
  paths:
    exclude:
      - ".devcontainer"
      - ".hooks"
      - ".vscode"
      - ".github"
      - docs

trigger:
  branches:
    include:
      - gh-readonly-queue/release/v1.6/*
  tags:
    include:
      - "*"

schedules:
- cron: "0 2 * * *" # Every day at 2am
  displayName: "Official Nightly Pipeline"
  branches:
    include: ["master"]
  always: true

variables:
  BUILD_POOL_NAME_DEFAULT: $(BUILD_POOL_1ESPT_AMD)
  BUILD_POOL_NAME_LINUX_AMD64: $(BUILD_POOL_1ESPT_AMD)
  BUILD_POOL_NAME_LINUX_ARM64: $(BUILD_POOL_1ESPT_ARM)

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

# Extend a governed 1ES Pipeline Template so the downstream release pipeline can
# verify which template produced this build's artifacts. This pipeline is marked
# Production in the 1ES Product Catalog because the release pipeline ships its
# artifacts, so it must extend Official on every branch, not just release refs.
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    # Agent for the compliance jobs 1ES injects. `os` is explicit because the pool
    # is a variable, so 1ES can't resolve the OS when it compiles the template.
    pool:
      name: $(BUILD_POOL_NAME_DEFAULT)
      os: linux

    # Guardian source analysis is Windows-only, and the pool above is Linux.
    sdl:
      sourceAnalysisPool:
        name: $(BUILD_POOL_NAME_DEFAULT_WINDOWS_ALT)
        os: windows

    stages:
      - stage: setup
        displayName: ACN
        jobs:
          - job: env
            displayName: Setup
            pool:
              name: "$(BUILD_POOL_NAME_DEFAULT)"
              os: linux
            steps:
              - script: |
                  # To use the variables below, you must make the respective stage's dependsOn have - setup or it will not retain context of this stage
                  BUILD_NUMBER=$(Build.BuildNumber)
                  echo "##vso[task.setvariable variable=StorageID;isOutput=true]$(echo ${BUILD_NUMBER//./-})"
                  echo "##vso[task.setvariable variable=commitID;isOutput=true]$(echo $(make revision)-$(date "+%d%H%M"))"
                  echo "##vso[task.setvariable variable=Tag;isOutput=true]$(make version)"
                  echo "##vso[task.setvariable variable=npmVersion;isOutput=true]$(make npm-version)"
                  cat /etc/os-release
                  uname -a
                  sudo chown -R $(whoami):$(whoami) .
                  go version
                  go env
                  which go
                  echo $PATH
                  echo "------"
                  echo "$(Build.QueuedBy)"
                  echo $(Build.Reason) # manual, PR, IndividualCI
                  echo $(Build.SourceBranch)
                name: "EnvironmentalVariables"
                displayName: "Set environmental variables"
                condition: always()

      - template: /.pipelines/templates/run-unit-tests.yaml@self

      - ${{ if not(contains(variables['Build.SourceBranch'], 'refs/pull')) }}:
        - stage: binaries
          displayName: Build Binaries
          dependsOn:
            - setup
            - test
          jobs:
            - job: build
              displayName: Build Binaries
              variables:
                STORAGE_ID: $[ stagedependencies.setup.env.outputs['EnvironmentalVariables.StorageID'] ]
              pool:
                name: "$(BUILD_POOL_NAME_DEFAULT)"
                os: linux
              templateContext:
                outputs:
                  # 1ES owns artifact publishing. sbomEnabled is off on every leg that
                  # writes to `output_staging` so the sbom stage stays the only SBOM
                  # producer. Build legs accumulate into the `output_staging` build
                  # artifact because build artifacts merge across jobs; the sbom stage
                  # republishes the assembled drop as the single `output` pipeline
                  # artifact that releases consume.
                  - output: buildArtifacts
                    PathtoPublish: "$(Build.ArtifactStagingDirectory)"
                    ArtifactName: "output_staging"
                    sbomEnabled: false
                    condition: succeeded()
              steps:
                - template: /.pipelines/templates/disk-cleanup.steps.yaml@self
                - script: |
                    set -e
                    make ipv6-hp-bpf-lib
                    make all-binaries-platforms
                  name: "BuildAllPlatformBinaries"
                  displayName: "Build all platform binaries"

                - script: |
                    mkdir -p ./output/bins
                    cd ./output
                    find . -name '*.tgz' -print -exec mv -t ./bins/ {} +
                    find . -name '*.zip' -print -exec mv -t ./bins/ {} +
                    shopt -s extglob
                    rm -rf !("bins")
                  name: "PrepareArtifacts"
                  displayName: "Prepare Artifacts"

                - task: CopyFiles@2
                  inputs:
                    sourceFolder: "output"
                    targetFolder: $(Build.ArtifactStagingDirectory)
                  condition: succeeded()

        - stage: containerize
          displayName: Build Images
          variables:
            CONTAINER_BUILDER: docker
          dependsOn:
            - setup
            - test
          jobs:
            - job: containerize_amd64
              displayName: Build Images
              pool:
                name: "$(BUILD_POOL_NAME_LINUX_AMD64)"
                os: linux
              strategy:
                matrix:
                  azure_ipam_linux_amd64:
                    arch: amd64
                    name: azure-ipam
                    os: linux
                  azure_ipam_windows:
                    arch: amd64
                    name: azure-ipam
                    os: windows
                  cni_linux_amd64:
                    arch: amd64
                    name: cni
                    os: linux
                  cni_windows_amd64:
                    arch: amd64
                    name: cni
                    os: windows
                  cns_linux_amd64:
                    arch: amd64
                    name: cns
                    os: linux
                  cns_windows_amd64:
                    arch: amd64
                    name: cns
                    os: windows
                  ipv6_hp_bpf_linux_amd64:
                    arch: amd64
                    name: ipv6-hp-bpf
                    os: linux
                  npm_linux_amd64:
                    arch: amd64
                    name: npm
                    os: linux
                  npm_windows_amd64:
                    arch: amd64
                    name: npm
                    os: windows
              steps:
                - template: /.pipelines/containers/container-template.yaml@self
                  parameters:
                    arch: $(arch)
                    name: $(name)
                    os: $(os)
                    os_version: $(os_version)
            - job: containerize_linux_arm64
              displayName: Build Images
              pool:
                name: "$(BUILD_POOL_NAME_LINUX_ARM64)"
                os: linux
              strategy:
                matrix:
                  azure_ipam_linux_arm64:
                    arch: arm64
                    name: azure-ipam
                    os: linux
                  cni_linux_arm64:
                    arch: arm64
                    name: cni
                    os: linux
                  cns_linux_arm64:
                    arch: arm64
                    name: cns
                    os: linux
                  ipv6_hp_bpf_linux_arm64:
                    arch: arm64
                    name: ipv6-hp-bpf
                    os: linux
                  npm_linux_arm64:
                    arch: arm64
                    name: npm
                    os: linux
              steps:
                - template: /.pipelines/containers/container-template.yaml@self
                  parameters:
                    arch: $(arch)
                    name: $(name)
                    os: $(os)

        - stage: publish
          displayName: Publish Multiarch Manifests
          dependsOn:
            - containerize
          variables:
            Packaging.EnableSBOMSigning: false
          jobs:
            - job: manifest
              displayName: Compile Manifests
              pool:
                name: "$(BUILD_POOL_NAME_DEFAULT)"
                os: linux
              templateContext:
                outputs:
                  - output: buildArtifacts
                    PathtoPublish: "$(Build.ArtifactStagingDirectory)"
                    ArtifactName: "output_staging"
                    sbomEnabled: false
                    condition: succeeded()
              strategy:
                matrix:
                  azure_ipam:
                    name: azure-ipam
                    platforms: linux/amd64 linux/arm64 windows/amd64
                  cni:
                    name: cni
                    platforms: linux/amd64 linux/arm64 windows/amd64
                  cns:
                    name: cns
                    platforms: linux/amd64 linux/arm64 windows/amd64
                  ipv6_hp_bpf:
                    name: ipv6-hp-bpf
                    platforms: linux/amd64 linux/arm64
                  npm:
                    name: npm
                    platforms: linux/amd64 linux/arm64 windows/amd64
              steps:
                - template: /.pipelines/containers/manifest-template.yaml@self
                  parameters:
                    name: $(name)
                    platforms: $(platforms)
                    publishArtifact: false

        - stage: sbom
          displayName: Generate SBOM
          dependsOn:
            - binaries
            - publish
          variables:
            Packaging.EnableSBOMSigning: true
          jobs:
            - job: sbom
              displayName: Generate and Sign SBOM
              pool:
                name: "$(BUILD_POOL_NAME_DEFAULT)"
                os: linux
              templateContext:
                outputs:
                  # Releases consume `output` and 1ES source-build validation rejects
                  # build artifacts ("Container") in release jobs, so the release drop
                  # must be a pipeline artifact. Pipeline artifacts are immutable and
                  # cannot be published by more than one job, so this job assembles the
                  # staged drop plus the signed _manifest and publishes it exactly once.
                  - output: pipelineArtifact
                    displayName: Publish assembled output pipeline artifact
                    targetPath: $(Pipeline.Workspace)/output_staging
                    artifactName: output
                    sbomEnabled: false
                    condition: succeeded()
              steps:
                - task: DownloadBuildArtifacts@1
                  displayName: Download full output artifact drop
                  inputs:
                    buildType: current
                    artifactName: output_staging
                    downloadPath: $(Pipeline.Workspace)

                - script: mkdir -p "$(Build.ArtifactStagingDirectory)/sbom"
                  displayName: Create SBOM staging directory

                - task: AzureArtifacts.manifest-generator-task.manifest-generator-task.ManifestGeneratorTask@0
                  displayName: Generate SBOM over full output artifact drop and sign _manifest
                  inputs:
                    BuildDropPath: $(Pipeline.Workspace)/output_staging
                    ManifestDirPath: $(Build.ArtifactStagingDirectory)/sbom

                - script: cp -r "$(Build.ArtifactStagingDirectory)/sbom/_manifest" "$(Pipeline.Workspace)/output_staging/_manifest"
                  displayName: Assemble signed _manifest into the release drop

        # Cilium Podsubnet E2E tests
        - template: /.pipelines/singletenancy/cilium/cilium-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "cilium_e2e"
            displayName: Cilium Podsubnet
            clusterType: swift-byocni-nokubeproxy-up
            clusterName: "ciliume2e"
            vmSize: Standard_B2ms
            k8sVersion: ""
            dependsOn: "containerize"

        # Cilium Podsubnet Vnet Scale E2E tests
        - template: /.pipelines/singletenancy/cilium/cilium-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "cilium_vnetscale_e2e"
            displayName: Cilium Podsubnet Vnet Scale Ubuntu
            os: linux
            clusterType: vnetscale-swift-byocni-nokubeproxy-up
            clusterName: "ciliumvscalee2e"
            vmSize: Standard_B2ms
            k8sVersion: ""
            dependsOn: "containerize"


        # Cilium Nodesubnet E2E tests
        - template: /.pipelines/singletenancy/cilium-nodesubnet/cilium-nodesubnet-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "cilium_nodesubnet_e2e"
            displayName: Cilium NodeSubnet
            clusterType: nodesubnet-byocni-nokubeproxy-up
            clusterName: "cilndsubnete2e"
            vmSize: Standard_B2s
            k8sVersion: ""
            dependsOn: "containerize"

        # Cilium Overlay E2E tests
        - template: /.pipelines/singletenancy/cilium-overlay/cilium-overlay-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "cilium_overlay_e2e"
            displayName: Cilium on AKS Overlay
            clusterType: overlay-byocni-nokubeproxy-up
            clusterName: "cilovere2e"
            vmSize: Standard_B2ms
            k8sVersion: ""
            dependsOn: "containerize"

        # Cilium Dualstack Overlay E2E tests
        - template: /.pipelines/singletenancy/cilium-dualstack-overlay/cilium-dualstackoverlay-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "cilium_dualstackoverlay_e2e"
            displayName: Cilium on AKS DualStack Overlay
            os: linux
            clusterType: dualstack-byocni-nokubeproxy-up
            clusterName: "cildsovere2e"
            vmSize: Standard_B2ms
            k8sVersion: ""
            dependsOn: "containerize"

            # Cilium Overlay with hubble E2E tests
        - template: /.pipelines/singletenancy/cilium-overlay-withhubble/cilium-overlay-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "cilium_h_overlay_e2e"
            displayName: Cilium on AKS Overlay with Hubble
            clusterType: overlay-byocni-nokubeproxy-up
            clusterName: "cilwhleovere2e"
            vmSize: Standard_B2ms
            k8sVersion: ""
            dependsOn: "containerize"
            testHubble: true

        # Azure Overlay E2E tests
        - template: /.pipelines/singletenancy/azure-cni-overlay/azure-cni-overlay-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "linux_azure_overlay_e2e"
            displayName: Azure Overlay Linux
            os: linux
            clusterType: overlay-byocni-up
            clusterName: "linuxazovere2e"
            vmSize: Standard_B2ms
            k8sVersion: ""
            dependsOn: "containerize"
            scaleup: 100

        - template: /.pipelines/singletenancy/azure-cni-overlay/azure-cni-overlay-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "win_azure_overlay_e2e"
            displayName: Azure Overlay Windows
            os: windows
            clusterType: overlay-byocni-up
            clusterName: "winazovere2e"
            vmSize: Standard_B2ms
            k8sVersion: ""
            dependsOn: "containerize"
            scaleup: 50

        # Azure Overlay E2E Stateless CNI tests
        - template: /.pipelines/singletenancy/azure-cni-overlay-stateless/azure-cni-overlay-stateless-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "azure_overlay_stateless_e2e"
            displayName: Azure Stateless CNI Overlay
            os: windows
            clusterType: overlay-byocni-up
            clusterName: "statelesswin"
            vmSize: Standard_B2ms
            dependsOn: "containerize"

        # AKS Swift E2E tests
        - template: /.pipelines/singletenancy/aks-swift/e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "aks_swift_e2e"
            displayName: AKS Swift Ubuntu
            os: linux
            clusterType: swift-byocni-up
            clusterName: "swifte2e"
            vmSize: Standard_B2ms
            k8sVersion: ""
            dependsOn: "containerize"

        # AKS Swift Vnet Scale E2E tests
        - template: /.pipelines/singletenancy/aks-swift/e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "aks_swift_vnetscale_e2e"
            displayName: AKS Swift Vnet Scale Ubuntu
            os: linux
            clusterType: vnetscale-swift-byocni-up
            clusterName: "vscaleswifte2e"
            vmSize: Standard_B2ms
            k8sVersion: "1.32"
            dependsOn: "containerize"

        # CNIv1 E2E tests
        - template: /.pipelines/singletenancy/aks/e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "aks_ubuntu_22_linux_e2e"
            displayName: AKS Ubuntu 22
            arch: "amd64"
            os: "linux"
            clusterType: cniv1-up
            clusterName: "ubuntu22e2e"
            vmSize: Standard_B2s
            k8sVersion: "1.32"
            scaleup: 100
            dependsOn: "containerize"

        - template: /.pipelines/singletenancy/aks/e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "aks_windows_22_e2e"
            displayName: AKS Windows 2022
            arch: amd64
            os: "windows"
            clusterType: cniv1-up
            clusterName: "win22e2e"
            vmSize: Standard_B2ms
            os_version: "ltsc2022"
            scaleup: 50
            dependsOn: "containerize"

        # CNI dual stack overlay E2E tests
        - template: /.pipelines/singletenancy/dualstack-overlay/dualstackoverlay-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "linux_dualstackoverlay_e2e"
            displayName: AKS DualStack Overlay Linux
            os: linux
            clusterType: dualstack-overlay-byocni-up
            clusterName: "linuxdsovere2e"
            vmSize: Standard_B2ms
            dependsOn: "containerize"
            scaleup: 100

        - template: /.pipelines/singletenancy/dualstack-overlay/dualstackoverlay-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: "win_dualstackoverlay_e2e"
            displayName: AKS DualStack Overlay Windows
            os: windows
            clusterType: dualstack-overlay-byocni-up
            clusterName: "windsovere2e"
            vmSize: Standard_B2ms
            dependsOn: "containerize"
            scaleup: 50

        - ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
          # AKS Swiftv2 Manifold E2E tests
          - template: /.pipelines/multitenancy/swiftv2-manifold-e2e.stages.yaml@self
            parameters:
              name: "swiftv2_manifold_e2e"
              dependsOn: publish

        - stage: delete
          displayName: Delete Clusters
          condition: always()
          dependsOn:
            - setup
            - linux_azure_overlay_e2e
            - win_azure_overlay_e2e
            - azure_overlay_stateless_e2e
            - aks_swift_e2e
            - cilium_e2e
            - cilium_vnetscale_e2e
            - cilium_nodesubnet_e2e
            - cilium_overlay_e2e
            - cilium_h_overlay_e2e
            - aks_ubuntu_22_linux_e2e
            - aks_swift_vnetscale_e2e
            - aks_windows_22_e2e
            - linux_dualstackoverlay_e2e
            - win_dualstackoverlay_e2e
            - cilium_dualstackoverlay_e2e
          variables:
            commitID: $[ stagedependencies.setup.env.outputs['EnvironmentalVariables.commitID'] ]
          jobs:
            - job: delete_build
              displayName: Delete Cluster
              pool:
                name: "$(BUILD_POOL_NAME_DEFAULT)"
                os: linux
              strategy:
                matrix:
                  cilium_e2e:
                    name: cilium_e2e
                    clusterName: "ciliume2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  cilium_vnetscale_e2e:
                    name: cilium_vnetscale_e2e
                    clusterName: "ciliumvscalee2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  cilium_nodesubnet_e2e:
                    name: cilium_nodesubnet_e2e
                    clusterName: "cilndsubnete2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  cilium_overlay_e2e:
                    name: cilium_overlay_e2e
                    clusterName: "cilovere2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  cilium_h_overlay_e2e:
                    name: cilium_h_overlay_e2e
                    clusterName: "cilwhleovere2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  linux_azure_overlay_e2e:
                    name: linux_azure_overlay_e2e
                    clusterName: "linuxazovere2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  windows_azure_overlay_e2e:
                    name: win_azure_overlay_e2e
                    clusterName: "winazovere2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  azure_overlay_stateless_e2e:
                    name: azure_overlay_stateless_e2e
                    clusterName: "statelesswin"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  aks_swift_e2e:
                    name: aks_swift_e2e
                    clusterName: "swifte2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  aks_swift_vnetscale_e2e:
                    name: aks_swift_vnetscale_e2e
                    clusterName: "vscaleswifte2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  aks_ubuntu_22_linux_e2e:
                    name: aks_ubuntu_22_linux_e2e
                    clusterName: "ubuntu22e2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  aks_windows_22_e2e:
                    name: aks_windows_22_e2e
                    clusterName: "win22e2e"
                    region: $(REGION_AKS_CLUSTER_TEST)
                  linux_dualstackoverlay_e2e:
                    name: linux_dualstackoverlay_e2e
                    clusterName: "linuxdsovere2e"
                    region: $(REGION_DUALSTACKOVERLAY_CLUSTER_TEST)
                  windows_dualstackoverlay_e2e:
                    name: windows_dualstackoverlay_e2e
                    clusterName: "windsovere2e"
                    region: $(REGION_DUALSTACKOVERLAY_CLUSTER_TEST)
                  cilium_dualstackoverlay_e2e:
                    name: cilium_dualstackoverlay_e2e
                    clusterName: "cildsovere2e"
                    region: $(REGION_DUALSTACKOVERLAY_CLUSTER_TEST)
              steps:
                - template: /.pipelines/templates/delete-cluster.yaml@self
                  parameters:
                    name: $(name)
                    clusterName: $(clusterName)-$(commitID)
                    region: $(region)
                    sub: $(SUB_AZURE_NETWORK_AGENT_BUILD_VALIDATIONS)
                    svcConn: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
