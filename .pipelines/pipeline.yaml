pr: none
trigger: none

variables:
  BUILD_POOL_NAME_DEFAULT: $(BUILD_POOL_1ESPT_AMD)
  commitID: $(Build.BuildId)
  REPRO_RUN_ID: $(Build.BuildId)
  AZURE_IPAM_VERSION: v0.5.0-1
  CNI_VERSION: v1.9.3-4
  CNS_VERSION: v1.9.3-4
  CNS_IMAGE_REPO: MCR
  IPAM_IMAGE_REPO: MCR
  CNI_IMAGE_REPO: MCR
  CNS_IMAGE_NAME_OVERRIDE: v2/azure-cns
  IPAM_IMAGE_NAME_OVERRIDE: v2/azure-ipam
  CNI_IMAGE_NAME_OVERRIDE: v2/azure-cni

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: $(BUILD_POOL_NAME_DEFAULT)
      os: linux
    sdl:
      sourceAnalysisPool:
        name: $(BUILD_POOL_NAME_DEFAULT_WINDOWS_ALT)
        os: windows
    stages:
      - ${{ each replica in split('1,2,3,4,5', ',') }}:
        - template: /.pipelines/singletenancy/dualstack-overlay/dualstackoverlay-e2e-job-template.yaml@self
          parameters:
            use1ESPublishTask: true
            name: win_dualstackoverlay_e2e_${{ replica }}
            displayName: AKS DualStack Overlay Windows ${{ replica }}
            os: windows
            clusterType: dualstack-overlay-byocni-up
            clusterName: wdsrepro${{ replica }}
            vmSize: Standard_B2ms
            dependsOn: []
            scaleup: 50

      - stage: delete_clusters
        displayName: Delete five reproduction clusters
        condition: always()
        dependsOn:
          - wdsrepro1
          - wdsrepro2
          - wdsrepro3
          - wdsrepro4
          - wdsrepro5
          - win_dualstackoverlay_e2e_1
          - win_dualstackoverlay_e2e_2
          - win_dualstackoverlay_e2e_3
          - win_dualstackoverlay_e2e_4
          - win_dualstackoverlay_e2e_5
        jobs:
          - job: delete
            timeoutInMinutes: 45
            steps:
              - bash: sleep 900
                displayName: Allow 15 minutes for live investigation
                condition: always()
              - template: /.pipelines/templates/delete-cluster.yaml@self
                parameters:
                  sub: $(SUB_AZURE_NETWORK_AGENT_BUILD_VALIDATIONS)
                  svcConn: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
                  suffix: -$(commitID)
                  requiredRunTag: $(Build.BuildId)
                  clusters:
                    - wdsrepro1
                    - wdsrepro2
                    - wdsrepro3
                    - wdsrepro4
                    - wdsrepro5
