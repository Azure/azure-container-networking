# Diagnostic branch only. This run is not PR validation.
trigger: none
pr: none

jobs:
- job: apt_mono_diagnostic
  displayName: Read-only APT and Mono trust diagnostics
  timeoutInMinutes: 10
  pool:
    name: Networking-ContainerNetworking-VMSS
  steps:
  - checkout: self
    fetchDepth: 1
    persistCredentials: false
  - bash: |
      set -euo pipefail
      sudo -n /usr/bin/python3 -B .pipelines/scripts/npm_apt_trust_diagnostic.py
    displayName: Inspect public APT trust state
    workingDirectory: $(Build.SourcesDirectory)
