trigger: none
pr: none

variables:
  BUILD_POOL_NAME_DEFAULT: $(BUILD_POOL_1ESPT_AMD)
  smokeCluster: acn-aad-$(Build.BuildId)-$(System.JobAttempt)
  smokeRegion: $(REGION_OVERLAY_CLUSTER_TEST)

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: $(BUILD_POOL_NAME_DEFAULT)
      os: linux
    sdl:
      sourceAnalysisPool:
        name: $(BUILD_POOL_NAME_DEFAULT_WINDOWS_ALT)
        os: windows
    stages:
      - stage: aad_smoke
        displayName: Entra cluster access smoke
        jobs:
          - job: probe
            displayName: Create, probe, and delete one owned cluster
            timeoutInMinutes: 90
            cancelTimeoutInMinutes: 30
            steps:
              - checkout: self
              - task: AzureCLI@2
                displayName: Create cluster and test existing identity permissions
                timeoutInMinutes: 45
                inputs:
                  azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    umask 077
                    test "$(az account show --query id -o tsv)" = "$SUB"
                    az version
                    az account show --query '{subscription:id,identity:user.name,identityType:user.type}' -o json
                    mkdir -p "$SMOKE_DIR"
                    export KUBECONFIG="$SMOKE_DIR/config"
                    if ! command -v kubectl >/dev/null || ! command -v kubelogin >/dev/null; then
                      mkdir -p "$SMOKE_DIR/bin"
                      az aks install-cli --install-location "$SMOKE_DIR/bin/kubectl" \
                        --kubelogin-install-location "$SMOKE_DIR/bin/kubelogin"
                      export PATH="$SMOKE_DIR/bin:$PATH"
                    fi
                    kubectl version --client
                    kubelogin --version
                    make -C hack/aks azcfg AZCLI=az REGION="$REGION"
                    az extension show --name aks-preview --query version -o tsv
                    version="${K8S_VERSION:-}"
                    version="${version//[[:space:]]/}"
                    case "$version" in
                      '$('*) echo "Unresolved Kubernetes version" >&2; exit 1 ;;
                    esac
                    if [ -n "$version" ]; then
                      export K8S_VER="$version"
                    fi

                    for group in "$CLUSTER" "MC_${CLUSTER}_${CLUSTER}_${REGION}"; do
                      exists="$(az group exists --subscription "$SUB" --name "$group")"
                      if [ "$exists" != false ]; then
                        echo "Refusing to reuse existing or unknown group: $group" >&2
                        exit 1
                      fi
                    done
                    touch "$SMOKE_DIR/preflight-passed"
                    az group create --subscription "$SUB" --name "$CLUSTER" --location "$REGION" \
                      --tags acnSmokeRun="$BUILD_BUILDID" acnSmokeCommit="$BUILD_SOURCEVERSION" \
                      -o none
                    # Preserve the ownership tags set above.
                    make -C hack/aks --assume-old=rg-up overlay-up AZCLI=az SUB="$SUB" REGION="$REGION" \
                      CLUSTER="$CLUSTER" NODE_COUNT=1 VM_SIZE=Standard_B2ms
                    az aks show --subscription "$SUB" --resource-group "$CLUSTER" --name "$CLUSTER" \
                      --query '{state:provisioningState,aadProfile:aadProfile,nodeResourceGroup:nodeResourceGroup}' -o json
                    az aks get-credentials --subscription "$SUB" --resource-group "$CLUSTER" \
                      --name "$CLUSTER" --file "$KUBECONFIG" --overwrite-existing
                    kubelogin convert-kubeconfig -l azurecli

                    failed=0
                    kubectl --request-timeout=30s get pods -A -o wide || failed=1
                    kubectl --request-timeout=30s auth can-i create pods || failed=1
                    kubectl --request-timeout=30s auth can-i create daemonsets.apps || failed=1
                    if kubectl --request-timeout=30s apply -f - <<'YAML'
                    apiVersion: v1
                    kind: Pod
                    metadata:
                      name: aad-smoke
                      namespace: default
                    spec:
                      containers:
                        - name: pause
                          image: mcr.microsoft.com/oss/kubernetes/pause:3.6
                    ---
                    apiVersion: apps/v1
                    kind: DaemonSet
                    metadata:
                      name: aad-smoke
                      namespace: default
                    spec:
                      selector:
                        matchLabels:
                          app: aad-smoke
                      template:
                        metadata:
                          labels:
                            app: aad-smoke
                        spec:
                          containers:
                            - name: pause
                              image: mcr.microsoft.com/oss/kubernetes/pause:3.6
                    YAML
                    then
                      kubectl --request-timeout=30s wait --for=condition=Ready pod/aad-smoke --timeout=120s || failed=1
                      kubectl --request-timeout=30s rollout status daemonset/aad-smoke --timeout=120s || failed=1
                    else
                      failed=1
                    fi
                    kubectl --request-timeout=30s get pods,daemonsets -n default -o wide || failed=1
                    exit "$failed"
                env:
                  SUB: $(SUB_AZURE_NETWORK_AGENT_BUILD_VALIDATIONS)
                  CLUSTER: $(smokeCluster)
                  REGION: $(smokeRegion)
                  SMOKE_DIR: $(Agent.TempDirectory)/aad-smoke-$(Build.BuildId)-$(System.JobAttempt)
              - task: AzureCLI@2
                displayName: Delete only this run's owned resource group
                condition: always()
                timeoutInMinutes: 30
                inputs:
                  azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    test "$(az account show --query id -o tsv)" = "$SUB"
                    if [ ! -f "$SMOKE_DIR/preflight-passed" ]; then
                      echo "Creation preflight did not pass; no resource deletion authorized."
                      exit 0
                    fi
                    exists="$(az group exists --subscription "$SUB" --name "$CLUSTER")"
                    case "$exists" in
                      true)
                        owner="$(az group show --subscription "$SUB" --name "$CLUSTER" --query tags.acnSmokeRun -o tsv)"
                        commit="$(az group show --subscription "$SUB" --name "$CLUSTER" --query tags.acnSmokeCommit -o tsv)"
                        if [ "$owner" != "$BUILD_BUILDID" ] || [ "$commit" != "$BUILD_SOURCEVERSION" ]; then
                          echo "Ownership mismatch; refusing to delete $CLUSTER" >&2
                          exit 1
                        fi
                        az group delete --subscription "$SUB" --name "$CLUSTER" --yes
                        ;;
                      false) echo "Owned resource group already absent." ;;
                      *) echo "Unexpected group existence result: $exists" >&2; exit 1 ;;
                    esac
                    for group in "$CLUSTER" "MC_${CLUSTER}_${CLUSTER}_${REGION}"; do
                      test "$(az group exists --subscription "$SUB" --name "$group")" = false
                      echo "Verified absent: $group"
                    done
                    rm -f "$SMOKE_DIR/config" "$SMOKE_DIR/config.lock"
                env:
                  SUB: $(SUB_AZURE_NETWORK_AGENT_BUILD_VALIDATIONS)
                  CLUSTER: $(smokeCluster)
                  REGION: $(smokeRegion)
                  SMOKE_DIR: $(Agent.TempDirectory)/aad-smoke-$(Build.BuildId)-$(System.JobAttempt)
