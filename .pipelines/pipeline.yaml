pr: none
trigger: none

parameters:
  - name: replicas
    type: object
    default: ["1", "2", "3"]
  - name: scenarios
    type: object
    default: [overlay, stateless, cniv1, dualstack]

variables:
  BUILD_POOL_NAME_DEFAULT: $(BUILD_POOL_1ESPT_AMD)
  BUILD_POOL_NAME_LINUX_ARM64: $(BUILD_POOL_1ESPT_ARM)
  commitID: $(Build.BuildId)
  IMAGE_REGISTRY: acnpublic.azurecr.io
  CNS_IMAGE_REPO: ACN
  IPAM_IMAGE_REPO: ACN
  CNI_IMAGE_REPO: ACN
  CNS_IMAGE_NAME_OVERRIDE: azure-cns
  IPAM_IMAGE_NAME_OVERRIDE: azure-ipam
  CNI_IMAGE_NAME_OVERRIDE: azure-cni

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: $(BUILD_POOL_NAME_DEFAULT)
      os: linux
    sdl:
      sourceAnalysisPool:
        name: $(BUILD_POOL_NAME_DEFAULT_WINDOWS_ALT)
        os: windows
    stages:
      - stage: setup
        displayName: Record v1.7 image versions
        jobs:
          - job: env
            steps:
              - bash: |
                  set -euo pipefail
                  cniVersion="$(make -s cni-version)"
                  cnsVersion="$(make -s cns-version)"
                  ipamVersion="$(make -s azure-ipam-version)"
                  if [[ -z "$cniVersion" || -z "$cnsVersion" || -z "$ipamVersion" ]]; then
                    echo "Image version resolution returned an empty value" >&2
                    exit 1
                  fi
                  echo "Source: $(Build.SourceVersion)"
                  echo "##vso[task.setvariable variable=commitID;isOutput=true]$(Build.BuildId)"
                  echo "##vso[task.setvariable variable=cniVersion;isOutput=true]$cniVersion"
                  echo "##vso[task.setvariable variable=cnsVersion;isOutput=true]$cnsVersion"
                  echo "##vso[task.setvariable variable=azureIpamVersion;isOutput=true]$ipamVersion"
                  echo "##vso[task.setvariable variable=ipamVersion;isOutput=true]$ipamVersion"
                  echo "##vso[task.setvariable variable=cniImageRepo;isOutput=true]ACN"
                  echo "##vso[task.setvariable variable=cnsImageRepo;isOutput=true]ACN"
                  echo "##vso[task.setvariable variable=ipamImageRepo;isOutput=true]ACN"
                  echo "##vso[task.setvariable variable=cniImageNameOverride;isOutput=true]azure-cni"
                  echo "##vso[task.setvariable variable=cnsImageNameOverride;isOutput=true]azure-cns"
                  echo "##vso[task.setvariable variable=ipamImageNameOverride;isOutput=true]azure-ipam"
                name: EnvironmentalVariables
              - bash: echo "##vso[task.setvariable variable=RunWindowsTests;isOutput=true]true"
                name: GitDiffCheck

      - stage: containerize
        displayName: Build fresh CNI CNS and IPAM images
        dependsOn: setup
        variables:
          CONTAINER_BUILDER: docker
        jobs:
          - job: containerize_amd64
            strategy:
              matrix:
                cni_linux:
                  name: cni
                  os: linux
                cni_windows:
                  name: cni
                  os: windows
                cns_linux:
                  name: cns
                  os: linux
                cns_windows:
                  name: cns
                  os: windows
                ipam_linux:
                  name: azure-ipam
                  os: linux
                ipam_windows:
                  name: azure-ipam
                  os: windows
            steps:
              - template: /.pipelines/containers/container-template.yaml@self
                parameters:
                  arch: amd64
                  name: $(name)
                  os: $(os)
          - job: containerize_arm64
            pool:
              name: $(BUILD_POOL_NAME_LINUX_ARM64)
              os: linux
            strategy:
              maxParallel: 2
              matrix:
                cni:
                  name: cni
                cns:
                  name: cns
                ipam:
                  name: azure-ipam
            steps:
              - template: /.pipelines/containers/container-template.yaml@self
                parameters:
                  arch: arm64
                  name: $(name)
                  os: linux

      - stage: publish
        displayName: Publish fresh image manifests
        dependsOn: containerize
        jobs:
          - job: manifest
            templateContext:
              outputs:
                - output: buildArtifacts
                  PathtoPublish: "$(Build.ArtifactStagingDirectory)"
                  ArtifactName: output_staging
                  sbomEnabled: false
                  condition: succeeded()
            strategy:
              matrix:
                cni:
                  name: cni
                cns:
                  name: cns
                ipam:
                  name: azure-ipam
            steps:
              - template: /.pipelines/containers/manifest-template.yaml@self
                parameters:
                  name: $(name)
                  platforms: linux/amd64 linux/arm64 windows/amd64

      - ${{ each replica in parameters.replicas }}:
        - ${{ if containsValue(parameters.scenarios, 'overlay') }}:
          - template: /.pipelines/singletenancy/azure-cni-overlay/azure-cni-overlay-e2e-job-template.yaml@self
            parameters:
              name: overlay_${{ replica }}
              displayName: Windows IPv4 Overlay ${{ replica }}
              os: windows
              clusterType: overlay-byocni-up
              clusterName: v17overlay${{ replica }}
              vmSize: Standard_B2ms
              dependsOn: [publish]
              scaleup: 50
        - ${{ if containsValue(parameters.scenarios, 'stateless') }}:
          - template: /.pipelines/singletenancy/azure-cni-overlay-stateless/azure-cni-overlay-stateless-e2e-job-template.yaml@self
            parameters:
              name: stateless_${{ replica }}
              displayName: Windows Stateless Overlay ${{ replica }}
              clusterType: overlay-byocni-up
              clusterName: v17stateless${{ replica }}
              vmSize: Standard_B2ms
              dependsOn: [publish]
        - ${{ if containsValue(parameters.scenarios, 'cniv1') }}:
          - template: /.pipelines/singletenancy/aks/e2e-job-template.yaml@self
            parameters:
              name: cniv1_${{ replica }}
              displayName: Windows 2022 CNIv1 ${{ replica }}
              arch: amd64
              os: windows
              os_version: ltsc2022
              clusterType: cniv1-up
              clusterName: v17cniv1${{ replica }}
              vmSize: Standard_B2ms
              dependsOn: [publish]
              scaleup: 50
        - ${{ if containsValue(parameters.scenarios, 'dualstack') }}:
          - template: /.pipelines/singletenancy/dualstack-overlay/dualstackoverlay-e2e-job-template.yaml@self
            parameters:
              name: dualstack_${{ replica }}
              displayName: Windows DualStack Overlay ${{ replica }}
              os: windows
              clusterType: dualstack-overlay-byocni-up
              clusterName: v17dualstack${{ replica }}
              vmSize: Standard_B2ms
              dependsOn: [publish]
              scaleup: 50

      - stage: delete_clusters
        displayName: Delete this run's test clusters
        condition: always()
        dependsOn:
          - setup
          - ${{ each replica in parameters.replicas }}:
            - ${{ each scenario in parameters.scenarios }}:
              - v17${{ scenario }}${{ replica }}
              - ${{ scenario }}_${{ replica }}
        jobs:
          - job: delete
            timeoutInMinutes: 45
            steps:
              - bash: sleep 900
                displayName: Allow 15 minutes for failure inspection
                condition: always()
              - template: /.pipelines/templates/delete-cluster.yaml@self
                parameters:
                  sub: $(SUB_AZURE_NETWORK_AGENT_BUILD_VALIDATIONS)
                  svcConn: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
                  suffix: -$(Build.BuildId)
                  clusters:
                    - ${{ each replica in parameters.replicas }}:
                      - ${{ each scenario in parameters.scenarios }}:
                        - v17${{ scenario }}${{ replica }}
