pr: 
  branches:
    include:
      - master
      - release/*
  paths:
    include:
      - cni/*
      - cns/*
      - npm/*
      - .pipelines/cni/*
      
trigger:
  tags:
    include:
    - dropgz/*
    - azure-ipam/*
    - v*
parameters:
  - name: imageBuildCanary
    displayName: Build only Linux CNI images with run-specific tags
    type: boolean
    default: false
  - name: upgradeScenario
    type: boolean
    default: false
  - name: ciliumVersionOverwrite
    type: boolean
    default: false

variables:
  BUILD_POOL_NAME_DEFAULT: acn-ado-azure-linux-3-amd64-pt-pool
  BUILD_POOL_NAME_LINUX_AMD64: acn-ado-azure-linux-3-amd64-pt-pool
  BUILD_POOL_NAME_LINUX_ARM64: acn-ado-azure-linux-3-arm64-pt-pool

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: $(BUILD_POOL_NAME_DEFAULT)
      os: linux
    sdl:
      sourceAnalysisPool:
        name: Networking-ContainerNetworking-VMSS-Windows
        os: windows
    stages:
      - ${{ if parameters.imageBuildCanary }}:
        - template: /.pipelines/cni/release-images.stage.yaml@self
          parameters:
            canary: true
      - ${{ else }}:
        - template: /.pipelines/cni/release-test.stages.yaml@self
          parameters:
            upgradeScenario: ${{ parameters.upgradeScenario }}
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
