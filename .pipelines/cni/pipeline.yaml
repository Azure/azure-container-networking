pr: 
  branches:
    include:
      - master
      - release/*
  paths:
    include:
      - cni/*
      - cns/*
      - npm/*
      - .pipelines/cni/*
      
trigger:
  tags:
    include:
    - dropgz/*
    - azure-ipam/*
    - v*
parameters:
  - name: upgradeScenario
    type: boolean
    default: false
  - name: ciliumVersionOverwrite
    type: boolean
    default: false

variables:
  - template: ../templates/npm-test-scope.variables.yaml
  - name: BUILD_POOL_NAME_DEFAULT
    value: acn-ado-azure-linux-3-amd64-pt-pool
  - name: BUILD_POOL_NAME_LINUX_AMD64
    value: acn-ado-azure-linux-3-amd64-pt-pool
  - name: BUILD_POOL_NAME_LINUX_ARM64
    value: acn-ado-azure-linux-3-arm64-pt-pool

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: $(BUILD_POOL_NAME_DEFAULT)
      os: linux
    sdl:
      sourceAnalysisPool:
        name: Networking-ContainerNetworking-VMSS-Windows
        os: windows
    stages:
      - stage: setup
        displayName: Setup
        jobs:
          - job: env
            displayName: Setup
            pool:
              name: "$(BUILD_POOL_NAME_DEFAULT)"
              os: linux
            steps:
              - script: |
                  echo "Setting up environment"
                  go version
                  echo "##vso[task.setvariable variable=commitID;isOutput=true]$(echo $(make revision)-$(date "+%d%H%M"))"
                  echo "##vso[task.setvariable variable=npmVersion;isOutput=true]$(make npm-version)"
                name: "SetEnvVars"
                displayName: "Set Environment Variables"
                condition: always()
              - script: |
                  echo "testing cilium version overwrite parameter"
                  make -C ./hack/aks print-cilium-vars
                  echo "ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}"
                  if [ ${{ parameters.ciliumVersionOverwrite }} != "True" ]; then
                    unset DIR
                    unset CILIUM_VERSION_TAG
                  fi
                  make -C ./hack/aks print-cilium-vars

                displayName: "Check ciliumVersionOverwrite parameter"

      - stage: build_images
        dependsOn: setup
        displayName: "Build Images"
        variables:
          CONTAINER_BUILDER: docker
        jobs:
          - job: containerize_amd64
            displayName: Build Images
            pool:
              name: "$(BUILD_POOL_NAME_LINUX_AMD64)"
              os: linux
            strategy:
              matrix:
                azure_ipam_linux_amd64:
                  arch: amd64
                  name: azure-ipam
                  os: linux
                azure_ipam_windows_amd64:
                  arch: amd64
                  name: azure-ipam
                  os: windows
                cni_linux_amd64:
                  arch: amd64
                  name: cni
                  os: linux
                cni_windows_amd64:
                  arch: amd64
                  name: cni
                  os: windows
                cns_linux_amd64:
                  arch: amd64
                  name: cns
                  os: linux
                cns_windows_amd64:
                  arch: amd64
                  name: cns
                  os: windows
                ipv6_hp_bpf_linux_amd64:
                  arch: amd64
                  name: ipv6-hp-bpf
                  os: linux
                npm_linux_amd64:
                  arch: amd64
                  name: npm
                  os: linux
                npm_windows_amd64:
                  arch: amd64
                  name: npm
                  os: windows
                cilium_log_collector_amd64:
                    arch: amd64
                    name: cilium-log-collector
                    os: linux
            steps:
              - template: /.pipelines/containers/container-template.yaml@self
                parameters:
                  arch: $(arch)
                  name: $(name)
                  os: $(os)
          - job: containerize_linux_arm64
            displayName: Build Images
            pool:
              name: "$(BUILD_POOL_NAME_LINUX_ARM64)"
              os: linux
            strategy:
              matrix:
                  azure_ipam_linux_arm64:
                    arch: arm64
                    name: azure-ipam
                    os: linux
                  cni_linux_arm64:
                    arch: arm64
                    name: cni
                    os: linux
                  cns_linux_arm64:
                    arch: arm64
                    name: cns
                    os: linux
                  ipv6_hp_bpf_linux_arm64:
                    arch: arm64
                    name: ipv6-hp-bpf
                    os: linux
                  npm_linux_arm64:
                    arch: arm64
                    name: npm
                    os: linux
                  cilium_log_collector_arm64:
                    arch: arm64
                    name: cilium-log-collector
                    os: linux
            steps:
              - template: /.pipelines/containers/container-template.yaml@self
                parameters:
                  arch: $(arch)
                  name: $(name)
                  os: $(os)

      - stage: binaries
        displayName: Build Binaries
        dependsOn: setup
        pool:
          name: $(BUILD_POOL_NAME_DEFAULT)
          os: linux
          demands:
            - agent.os -equals Linux
        jobs:
          - job: build_npm_k8s_linux
            displayName: "Build k8s NPM Linux Test Suite Binary"
            steps:
              - bash: |
                  git clone https://github.com/kubernetes/kubernetes.git --depth=1
                  cd kubernetes
                  export PATH=$PATH:/usr/local/go/bin/
                  make WHAT=test/e2e/e2e.test
                displayName: "Build Kubernetes e2e.test"
              - task: 1ES.PublishPipelineArtifact@1
                inputs:
                  targetPath: $(System.DefaultWorkingDirectory)/kubernetes/_output/local/bin/linux/amd64
                  artifactName: npm_k8s
                  sbomEnabled: false
          - job: build_npm_k8s_windows
            displayName: "Build k8s NPM Windows Test Suite Binary"
            steps:
              - bash: |
                  git clone https://github.com/kubernetes/kubernetes.git --depth=1
                  cd kubernetes
                  export PATH=$PATH:/usr/local/go/bin/
                  make WHAT=test/e2e/e2e.test
                displayName: "Build Kubernetes e2e.test"
              - task: 1ES.PublishPipelineArtifact@1
                inputs:
                  targetPath: $(System.DefaultWorkingDirectory)/kubernetes/_output/local/bin/linux/amd64
                  artifactName: npm_k8s_windows
                  sbomEnabled: false

      - stage: publish
        displayName: Publish Multiarch Manifests
        dependsOn:
          - build_images
        jobs:
          - job: manifest
            displayName: Compile Manifests
            templateContext:
              outputs:
                - output: buildArtifacts
                  PathtoPublish: "$(Build.ArtifactStagingDirectory)"
                  ArtifactName: output
                  condition: succeeded()
            pool:
              name: "$(BUILD_POOL_NAME_DEFAULT)"
              os: linux
            strategy:
              matrix:
                azure-ipam:
                  name: azure-ipam
                  platforms: linux/amd64 linux/arm64 windows/amd64
                cni:
                  name: cni
                  platforms: linux/amd64 linux/arm64 windows/amd64
                cns:
                  name: cns
                  platforms: linux/amd64 linux/arm64 windows/amd64
                ipv6-hp-bpf:
                  name: ipv6-hp-bpf
                  platforms: linux/amd64 linux/arm64
                npm:
                  name: npm
                  platforms: linux/amd64 linux/arm64 windows/amd64
                cilium_log_collector:
                  name: cilium-log-collector
                  platforms: linux/amd64 linux/arm64
            steps:
              - template: /.pipelines/containers/manifest-template.yaml@self
                parameters:
                  name: $(name)
                  publishArtifact: false
                  platforms: $(platforms)

    ## Windows E2E
      - template: /.pipelines/cni/singletenancy/cniv1-template.yaml@self
        parameters:
          name: win22_cniv1
          clusterType: cniv1-up
          clusterName: "win22-cniv1"
          nodeCount: ${NODE_COUNT_WINCLUSTER_SYSTEMPOOL}
          nodeCountWin: ${NODE_COUNT_WIN}
          vmSize: ${VM_SIZE_WINCLUSTER_SYSTEMPOOL}
          vmSizeWin: ${VM_SIZE_WIN}
          arch: amd64
          os: windows
          os_version: 'ltsc2022'
          osSkuWin: 'Windows2022'
          scaleup: ${SCALEUP_WIN}
          iterations: ${ITERATIONS_WIN}

      - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
        parameters:
          name: windows_podsubnet
          clusterType: swift-byocni-up
          clusterName: w22-podsub
          nodeCount: ${NODE_COUNT_WINCLUSTER_SYSTEMPOOL}
          nodeCountWin: ${NODE_COUNT_WIN}
          vmSize: ${VM_SIZE_WINCLUSTER_SYSTEMPOOL}
          vmSizeWin: ${VM_SIZE_WIN}
          arch: amd64
          os: windows
          os_version: 'ltsc2022'
          osSkuWin: 'Windows2022'
          scaleup: ${SCALEUP_WIN}
          iterations: ${ITERATIONS_WIN}
          upgradeScenario: false

      - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
        parameters:
          name: windows_overlay
          clusterType: overlay-byocni-up
          clusterName: w22-over
          nodeCount: ${NODE_COUNT_WINCLUSTER_SYSTEMPOOL}
          nodeCountWin: ${NODE_COUNT_WIN}
          vmSize: ${VM_SIZE_WINCLUSTER_SYSTEMPOOL}
          vmSizeWin: ${VM_SIZE_WIN}
          arch: amd64
          os: windows
          os_version: 'ltsc2022'
          osSkuWin: 'Windows2022'
          scaleup: ${SCALEUP_WIN}
          iterations: ${ITERATIONS_WIN}
          upgradeScenario: false

    ## Linux E2E
      - template: /.pipelines/cni/singletenancy/cniv1-template.yaml@self
        parameters:
          name: linux_cniv1
          clusterType: cniv1-up
          clusterName: "linux-cniv1"
          nodeCount: ${NODE_COUNT_LINUX}
          vmSize: ${VM_SIZE}
          os: linux
          arch: amd64
          scaleup: ${SCALEUP_LINUX}
          iterations: ${ITERATIONS_LINUX}

      - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
        parameters:
          name: linux_podsubnet
          clusterType: swift-byocni-up
          clusterName: "linux-podsub"
          nodeCount: ${NODE_COUNT_LINUX}
          vmSize: ${VM_SIZE}
          arch: amd64
          scaleup: ${SCALEUP_LINUX}
          iterations: ${ITERATIONS_LINUX}
          upgradeScenario: false

      - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
        parameters:
          name: linux_overlay
          clusterType: overlay-byocni-up
          clusterName: "linux-over"
          nodeCount: ${NODE_COUNT_LINUX}
          vmSize: ${VM_SIZE}
          arch: amd64
          scaleup: ${SCALEUP_LINUX}
          iterations: ${ITERATIONS_LINUX}
          upgradeScenario: false

      - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
        parameters:
          name: mariner_linux_overlay
          clusterType: overlay-byocni-up
          clusterName: "mariner-over"
          nodeCount: ${NODE_COUNT_LINUX}
          vmSize:  ${VM_SIZE}
          arch: amd64
          osSKU: AzureLinux
          scaleup: ${SCALEUP_LINUX}
          iterations: ${ITERATIONS_LINUX}
          upgradeScenario: false

      - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
        parameters:
          name: arm_linux_overlay
          clusterType: overlay-byocni-up
          clusterName: "arm-over"
          nodeCount: ${NODE_COUNT_LINUX}
          vmSize: Standard_D8ps_v5
          arch: arm64
          scaleup: ${SCALEUP_LINUX}
          iterations: ${ITERATIONS_LINUX}
          upgradeScenario: false

      - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
        parameters:
          name: rdma_linux_overlay
          clusterType: overlay-byocni-up
          clusterName: "rdma-over"
          nodeCount: 2
          vmSize: Standard_HC44-16rs
          arch: amd64
          scaleup: ${SCALEUP_LINUX}
          iterations: ${ITERATIONS_LINUX}
          upgradeScenario: false

    ## Cilium E2E
      - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
        parameters:
          name: cilium_overlay
          clusterType: overlay-byocni-nokubeproxy-up
          clusterName: "cilium-over"
          nodeCount: ${NODE_COUNT_CILIUM}
          vmSize: ${VM_SIZE_CILIUM}
          arch: amd64
          cni: "cilium"
          upgradeScenario: false
          ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}

      - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
        parameters:
          name: cilium_overlay_hubble
          clusterType: overlay-byocni-nokubeproxy-up
          clusterName: "cil-over-hub"
          hubbleEnabled: true
          nodeCount: ${NODE_COUNT_CILIUM}
          vmSize: ${VM_SIZE_CILIUM}
          arch: amd64
          cni: "cilium"
          upgradeScenario: false
          ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}

      - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
        parameters:
          name: cilium_overlay_mariner
          clusterType: overlay-byocni-nokubeproxy-up
          clusterName: "cil-over-mar"
          nodeCount: ${NODE_COUNT_CILIUM}
          vmSize: ${VM_SIZE_CILIUM}
          arch: amd64
          osSKU: AzureLinux
          cni: "cilium"
          upgradeScenario: false
          ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}

      - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
        parameters:
          name: cilium_overlay_arm
          clusterType: overlay-byocni-nokubeproxy-up
          clusterName: "cil-over-arm"
          nodeCount: ${NODE_COUNT_CILIUM}
          vmSize: Standard_D8ps_v5
          arch: arm64
          cni: "cilium"
          upgradeScenario: false
          ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}

      - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
        parameters:
          name: cilium_overlay_rdma
          clusterType: overlay-byocni-nokubeproxy-up
          clusterName: "cil-over-rdma"
          nodeCount: 2
          vmSize: Standard_HC44-16rs
          arch: amd64
          cni: "cilium"
          upgradeScenario: false
          ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}

      - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
        parameters:
          name: cilium_overlay_ds
          clusterType: dualstack-byocni-nokubeproxy-up
          clusterName: "cil-ds-ov"
          nodeCount: ${NODE_COUNT_CILIUM}
          vmSize: ${VM_SIZE_CILIUM}
          arch: amd64
          dualstackVersion: ${CILIUM_DUALSTACK_VERSION}
          cni: "cilium_dualstack"
          upgradeScenario: false
          ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}

      - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
        parameters:
          name: cilium_ds_arm
          clusterType: dualstack-byocni-nokubeproxy-up
          clusterName: "cil-ds-arm"
          nodeCount: ${NODE_COUNT_CILIUM}
          vmSize: Standard_D8ps_v5
          arch: arm64
          dualstackVersion: ${CILIUM_DUALSTACK_VERSION}
          cni: "cilium_dualstack"
          upgradeScenario: false
          ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}

      - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
        parameters:
          name: cilium_ds_mariner
          clusterType: dualstack-byocni-nokubeproxy-up
          clusterName: "cil-ds-mar"
          nodeCount: ${NODE_COUNT_CILIUM}
          vmSize: ${VM_SIZE_CILIUM}
          arch: amd64
          osSKU: AzureLinux
          dualstackVersion: ${CILIUM_DUALSTACK_VERSION}
          cni: "cilium_dualstack"
          upgradeScenario: false
          ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}

      - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
        parameters:
          name: cilium_ds_rdma
          clusterType: dualstack-byocni-nokubeproxy-up
          clusterName: "cil-ds-rdma"
          nodeCount: 2
          vmSize: Standard_HC44-16rs
          arch: amd64
          dualstackVersion: ${CILIUM_DUALSTACK_VERSION}
          cni: "cilium_dualstack"
          upgradeScenario: false
          ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}


      ## If upgradeScenario is set, redeploy new IPAM/CNS version to existing clusters and run tests
      - ${{if eq(parameters.upgradeScenario, true)}}:
        - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
          parameters:
            name: cilium_overlay_upgrade
            clusterType: overlay-byocni-nokubeproxy-up
            clusterName: "cilium-over"
            nodeCount: ${NODE_COUNT_CILIUM}
            vmSize: ${VM_SIZE_CILIUM}
            arch: amd64
            cni: "cilium"
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: cilium_overlay

        - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
          parameters:
            name: cilium_overlay_hubble_upgrade
            clusterType: overlay-byocni-nokubeproxy-up
            clusterName: "cil-over-hub"
            hubbleEnabled: true
            nodeCount: ${NODE_COUNT_CILIUM}
            vmSize: ${VM_SIZE_CILIUM}
            arch: amd64
            cni: "cilium"
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: cilium_overlay_hubble

        - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
          parameters:
            name: cilium_overlay_mariner_upgrade
            clusterType: overlay-byocni-nokubeproxy-up
            clusterName: "cil-over-mar"
            nodeCount: ${NODE_COUNT_CILIUM}
            vmSize: ${VM_SIZE_CILIUM}
            arch: amd64
            osSKU: AzureLinux
            cni: "cilium"
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: cilium_overlay_mariner

        - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
          parameters:
            name: cilium_overlay_arm_upgrade
            clusterType: overlay-byocni-nokubeproxy-up
            clusterName: "cil-over-arm"
            nodeCount: ${NODE_COUNT_CILIUM}
            vmSize: Standard_D8ps_v5
            arch: arm64
            cni: "cilium"
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: cilium_overlay_arm

        - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
          parameters:
            name: cilium_overlay_rdma_upgrade
            clusterType: overlay-byocni-nokubeproxy-up
            clusterName: "cil-over-rdma"
            nodeCount: 2
            vmSize: Standard_HC44-16rs
            arch: amd64
            cni: "cilium"
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: cilium_overlay_rdma

        - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
          parameters:
            name: cilium_overlay_ds_upgrade
            clusterType: dualstack-byocni-nokubeproxy-up
            clusterName: "cil-ds-ov"
            nodeCount: ${NODE_COUNT_CILIUM}
            vmSize: ${VM_SIZE_CILIUM}
            arch: amd64
            dualstackVersion: ${CILIUM_DUALSTACK_VERSION}
            cni: "cilium_dualstack"
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: cilium_overlay_ds

        - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
          parameters:
            name: cilium_ds_arm_upgrade
            clusterType: dualstack-byocni-nokubeproxy-up
            clusterName: "cil-ds-arm"
            nodeCount: ${NODE_COUNT_CILIUM}
            vmSize: Standard_D8ps_v5
            arch: arm64
            dualstackVersion: ${CILIUM_DUALSTACK_VERSION}
            cni: "cilium_dualstack"
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: cilium_ds_arm

        - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
          parameters:
            name: cilium_ds_mariner_upgrade
            clusterType: dualstack-byocni-nokubeproxy-up
            clusterName: "cil-ds-mar"
            nodeCount: ${NODE_COUNT_CILIUM}
            vmSize: ${VM_SIZE_CILIUM}
            arch: amd64
            osSKU: AzureLinux
            dualstackVersion: ${CILIUM_DUALSTACK_VERSION}
            cni: "cilium_dualstack"
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: cilium_ds_mariner

        - template: /.pipelines/cni/cilium/cilium-overlay-load-test-template.yaml@self
          parameters:
            name: cilium_ds_rdma_upgrade
            clusterType: dualstack-byocni-nokubeproxy-up
            clusterName: "cil-ds-rdma"
            nodeCount: 2
            vmSize: Standard_HC44-16rs
            arch: amd64
            dualstackVersion: ${CILIUM_DUALSTACK_VERSION}
            cni: "cilium_dualstack"
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: cilium_ds_rdma

        - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
          parameters:
            name: linux_podsubnet_upgrade
            clusterType: swift-byocni-up
            clusterName: "linux-podsub"
            nodeCount: ${NODE_COUNT_LINUX}
            vmSize: ${VM_SIZE}
            arch: amd64
            scaleup: ${SCALEUP_LINUX}
            iterations: ${ITERATIONS_LINUX}
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: linux_podsubnet

        - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
          parameters:
            name: linux_overlay_upgrade
            clusterType: overlay-byocni-up
            clusterName: "linux-over"
            nodeCount: ${NODE_COUNT_LINUX}
            vmSize: ${VM_SIZE}
            arch: amd64
            scaleup: ${SCALEUP_LINUX}
            iterations: ${ITERATIONS_LINUX}
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: linux_overlay

        - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
          parameters:
            name: mariner_linux_overlay_upgrade
            clusterType: overlay-byocni-up
            clusterName: "mariner-over"
            nodeCount: ${NODE_COUNT_LINUX}
            vmSize:  ${VM_SIZE}
            arch: amd64
            osSKU: AzureLinux
            scaleup: ${SCALEUP_LINUX}
            iterations: ${ITERATIONS_LINUX}
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: mariner_linux_overlay

        - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
          parameters:
            name: arm_linux_overlay_upgrade
            clusterType: overlay-byocni-up
            clusterName: "arm-over"
            nodeCount: ${NODE_COUNT_LINUX}
            vmSize: Standard_D8ps_v5
            arch: arm64
            scaleup: ${SCALEUP_LINUX}
            iterations: ${ITERATIONS_LINUX}
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: arm_linux_overlay

        - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
          parameters:
            name: rdma_linux_overlay_upgrade
            clusterType: overlay-byocni-up
            clusterName: "rdma-over"
            nodeCount: 2
            vmSize: Standard_HC44-16rs
            arch: amd64
            scaleup: ${SCALEUP_LINUX}
            iterations: ${ITERATIONS_LINUX}
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: rdma_linux_overlay

        - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
          parameters:
            name: windows_podsubnet_upgrade
            clusterType: swift-byocni-up
            clusterName: w22-podsub
            nodeCount: ${NODE_COUNT_WINCLUSTER_SYSTEMPOOL}
            nodeCountWin: ${NODE_COUNT_WIN}
            vmSize: ${VM_SIZE_WINCLUSTER_SYSTEMPOOL}
            vmSizeWin: ${VM_SIZE_WIN}
            arch: amd64
            os: windows
            os_version: 'ltsc2022'
            osSkuWin: 'Windows2022'
            scaleup: ${SCALEUP_WIN}
            iterations: ${ITERATIONS_WIN}
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: windows_podsubnet_HNS

        - template: /.pipelines/cni/singletenancy/cniv2-template.yaml@self
          parameters:
            name: windows_overlay_upgrade
            clusterType: overlay-byocni-up
            clusterName: w22-over
            nodeCount: ${NODE_COUNT_WINCLUSTER_SYSTEMPOOL}
            nodeCountWin: ${NODE_COUNT_WIN}
            vmSize: ${VM_SIZE_WINCLUSTER_SYSTEMPOOL}
            vmSizeWin: ${VM_SIZE_WIN}
            arch: amd64
            os: windows
            os_version: 'ltsc2022'
            osSkuWin: 'Windows2022'
            scaleup: ${SCALEUP_WIN}
            iterations: ${ITERATIONS_WIN}
            upgradeScenario: true
            ciliumVersionOverwrite: ${{ parameters.ciliumVersionOverwrite }}
            dependsOn: windows_overlay_HNS

      - stage: delete_resources
        displayName: "Delete Resources"
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
          os: linux
        condition: always()
        dependsOn:
          - cilium_overlay
          - cilium_overlay_hubble
          - cilium_overlay_mariner
          - cilium_overlay_arm
          - cilium_overlay_rdma
          - cilium_overlay_ds
          - cilium_ds_arm
          - cilium_ds_mariner
          - cilium_ds_rdma
          - win22_cniv1_HNS
          - linux_cniv1
          - linux_podsubnet
          - linux_overlay
          - mariner_linux_overlay
          - arm_linux_overlay
          - rdma_linux_overlay
          - windows_podsubnet_HNS
          - windows_overlay_HNS
          - setup
          - ${{if eq(parameters.upgradeScenario, true)}}:
            - cilium_overlay_upgrade
            - cilium_overlay_hubble_upgrade
            - cilium_overlay_mariner_upgrade
            - cilium_overlay_arm_upgrade
            - cilium_overlay_rdma_upgrade
            - cilium_overlay_ds_upgrade
            - cilium_ds_arm_upgrade
            - cilium_ds_mariner_upgrade
            - cilium_ds_rdma_upgrade
            - linux_podsubnet_upgrade
            - linux_overlay_upgrade
            - mariner_linux_overlay_upgrade
            - arm_linux_overlay_upgrade
            - rdma_linux_overlay_upgrade
            - windows_podsubnet_upgrade
            - windows_overlay_upgrade
            - windows_podsubnet_upgrade_HNS
            - windows_overlay_upgrade_HNS
        variables:
          commitID: $[ stagedependencies.setup.env.outputs['SetEnvVars.commitID'] ]
        jobs:
          - job: delete
            displayName: Delete Clusters
            pool:
              name: "$(BUILD_POOL_NAME_DEFAULT)"
              os: linux
            steps:
              - template: /.pipelines/templates/delete-cluster.yaml@self
                parameters:
                  sub: $(SUB_AZURE_NETWORK_AGENT_BUILD_VALIDATIONS)
                  svcConn: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
                  deleteResources: $(DELETE_RESOURCES)
                  suffix: -$(commitID)
                  clusters:
                    - cilium-over
                    - cil-over-hub
                    - cil-over-mar
                    - cil-over-arm
                    - cil-over-rdma
                    - cil-ds-ov
                    - cil-ds-arm
                    - cil-ds-mar
                    - cil-ds-rdma
                    - win22-cniv1
                    - linux-cniv1
                    - linux-podsub
                    - linux-over
                    - mariner-over
                    - arm-over
                    - rdma-over
                    - w22-podsub
                    - w22-over
