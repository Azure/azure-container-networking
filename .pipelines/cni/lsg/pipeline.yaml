pr: none
trigger: none

# Placeholder for when we want to enable automatic queuing of pipeline from LSG's pipeline.
# Fully functional to queue off of ACN PR Pipeline
# resources:
#   pipelines:
#   - pipeline: ACN-PR # Name of the pipeline resource.
#     source: \Custom\Networking\ContainerNetworking\Azure Container Networking PR # The name of the pipeline referenced by this pipeline resource.
#     trigger: true # Run CNI | LSG Integration pipeline when any run of LSG defined pipeline completes


stages:
  - stage: setup
    displayName: Setup
    jobs:
      - job: env
        displayName: Setup
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - script: |
              set -euo pipefail

              echo "Setting up environment"
              go version
              echo "##vso[task.setvariable variable=commitID;isOutput=true]$(echo $(make revision)-$(Build.BuildId))"

              echo "------"
              echo Queued by $(Build.QueuedBy)
              echo "Runtime Variables passed"
              echo "DistroVersion : $(DistroVersion)"
              echo "KernelType : $(KernelType)"
              echo "KernelVersion : $(KernelVersion)"
              echo "ProposedRepoVersion : $(ProposedRepoVersion)"
              echo "CNS_VERSION : $(CNS_VERSION)"
              echo "CNI_VERSION : $(CNI_VERSION)"
              echo "IPAM_VERSION : $(IPAM_VERSION)"
              echo "CILIUM_VERSION_TAG : $(CILIUM_VERSION_TAG)"
              echo "------"

              DISTRO=$(echo "$(DistroVersion)" | tr '[:upper:]' '[:lower:]')
              CNS_VERSION_VALUE="$(CNS_VERSION)"
              CNI_VERSION_VALUE="$(CNI_VERSION)"
              IPAM_VERSION_VALUE="$(IPAM_VERSION)"
              CILIUM_VERSION_VALUE="$(CILIUM_VERSION_TAG)"
              CNS_IMAGE_REPO_VALUE="$(CNS_IMAGE_REPO)"
              CNI_IMAGE_REPO_VALUE="$(CNI_IMAGE_REPO)"
              IPAM_IMAGE_REPO_VALUE="$(IPAM_IMAGE_REPO)"
              CILIUM_IMAGE_REGISTRY_VALUE="$(CILIUM_IMAGE_REGISTRY)"
              K8S_MINOR=latest
              ENABLE_FIPS=false
              LTS=false
              CILIUM_IMAGE_NAME=cilium-distroless
              CILIUM_INIT_IMAGE_NAME=cilium-distroless-init
              case "$DISTRO" in
                focal)
                  OS_SKU=Ubuntu
                  K8S_MINOR=1.33
                  ENABLE_FIPS=true
                  LTS=true
                  CNS_VERSION_VALUE=v1.7.16-0
                  CNI_VERSION_VALUE=v1.7.16-0
                  IPAM_VERSION_VALUE=v0.4.0-0
                  CILIUM_VERSION_VALUE=v1.17.18-260811
                  CNS_IMAGE_REPO_VALUE=MCR
                  CNI_IMAGE_REPO_VALUE=MCR
                  IPAM_IMAGE_REPO_VALUE=MCR
                  CILIUM_IMAGE_REGISTRY_VALUE=mcr.microsoft.com/containernetworking
                  CILIUM_IMAGE_NAME=cilium
                  CILIUM_INIT_IMAGE_NAME=cilium
                  ;;
                jammy)
                  OS_SKU=Ubuntu2204
                  if [[ "$(KernelType)" == *"lts-24.04"* ]]; then
                    echo "##vso[task.logissue type=warning]KernelType $(KernelType) is unusual for Jammy; trusting the LSG-provided tuple"
                  fi
                  ;;
                noble)
                  OS_SKU=Ubuntu2404
                  if [[ "$(KernelVersion)" == *"~22.04"* ]]; then
                    echo "##vso[task.logissue type=warning]KernelVersion $(KernelVersion) is unusual for Noble; trusting the LSG-provided tuple"
                  fi
                  ;;
                *)
                  echo "DistroVersion must be focal, jammy, or noble; got: $(DistroVersion)"
                  exit 1
                  ;;
              esac
              echo "Resolved OS SKU : $OS_SKU"
              echo "Effective CNS_VERSION : $CNS_VERSION_VALUE"
              echo "Effective CNI_VERSION : $CNI_VERSION_VALUE"
              echo "Effective IPAM_VERSION : $IPAM_VERSION_VALUE"
              echo "Effective CILIUM_VERSION_TAG : $CILIUM_VERSION_VALUE"
              echo "##vso[task.setvariable variable=resolvedDistro;isOutput=true]$DISTRO"
              echo "##vso[task.setvariable variable=osSKU;isOutput=true]$OS_SKU"
              echo "##vso[task.setvariable variable=k8sMinor;isOutput=true]$K8S_MINOR"
              echo "##vso[task.setvariable variable=enableFips;isOutput=true]$ENABLE_FIPS"
              echo "##vso[task.setvariable variable=lts;isOutput=true]$LTS"
              echo "##vso[task.setvariable variable=cnsVersion;isOutput=true]$CNS_VERSION_VALUE"
              echo "##vso[task.setvariable variable=cniVersion;isOutput=true]$CNI_VERSION_VALUE"
              echo "##vso[task.setvariable variable=ipamVersion;isOutput=true]$IPAM_VERSION_VALUE"
              echo "##vso[task.setvariable variable=ciliumVersion;isOutput=true]$CILIUM_VERSION_VALUE"
              echo "##vso[task.setvariable variable=cnsImageRepo;isOutput=true]$CNS_IMAGE_REPO_VALUE"
              echo "##vso[task.setvariable variable=cniImageRepo;isOutput=true]$CNI_IMAGE_REPO_VALUE"
              echo "##vso[task.setvariable variable=ipamImageRepo;isOutput=true]$IPAM_IMAGE_REPO_VALUE"
              echo "##vso[task.setvariable variable=ciliumImageRegistry;isOutput=true]$CILIUM_IMAGE_REGISTRY_VALUE"
              echo "##vso[task.setvariable variable=ciliumImageName;isOutput=true]$CILIUM_IMAGE_NAME"
              echo "##vso[task.setvariable variable=ciliumInitImageName;isOutput=true]$CILIUM_INIT_IMAGE_NAME"

              echo "KernelType Check"
              Kernel=$(KernelType)
              if [ "$Kernel" = 'proposed-azure' ]; then
                echo "KernelType is $Kernel , change to linux-azure"
                Kernel=linux-azure
              fi
              if [ "$Kernel" = 'proposed-edge' ]; then
                echo "KernelType is $Kernel , change to linux-azure-edge"
                Kernel=linux-azure-edge
              fi
              echo "Final KernelType : $Kernel"
              echo "##vso[task.setvariable variable=kernelType;isOutput=true]$Kernel"
            name: "SetEnvVars"
            displayName: "Set Environment Variables"
            condition: always()

  - template: lsg-cni-integration-template.yaml
    parameters:
      name: linux_overlay
      clusterType: overlay-byocni-up
      clusterName: "kup-over"
      nodeCount: 2
      vmSize: Standard_B2ms
      arch: amd64
      cni: cniv2
      region: $(LOCATION)
      networkType: azure-cni-overlay
      installFlag: INSTALL_AZURE_CNI_OVERLAY

  - template: lsg-cni-integration-template.yaml
    parameters:
      name: cilium_overlay
      clusterType: overlay-byocni-nokubeproxy-up
      clusterName: "kup-cilover"
      nodeCount: 2
      vmSize: Standard_B2ms
      arch: amd64
      cni: cilium
      region: $(LOCATION)
      networkType: cilium-overlay
      installFlag: INSTALL_OVERLAY

  # Dualstack
  - template: lsg-cni-integration-template.yaml
    parameters:
      name: linux_overlay_ds
      clusterType: dualstack-overlay-byocni-up
      clusterName: "kup-over-ds"
      nodeCount: 2
      vmSize: Standard_B2ms
      arch: amd64
      cni: dualstack
      region: $(REGION_AKS_CLUSTER_TEST)
      networkType: azure-cni-dualstack-overlay
      installFlag: INSTALL_DUALSTACK_OVERLAY

  - template: lsg-cni-integration-template.yaml
    parameters:
      name: cilium_overlay_ds
      clusterType: dualstack-byocni-nokubeproxy-up
      clusterName: "kup-cilov-ds"
      nodeCount: 2
      vmSize: Standard_B2ms
      arch: amd64
      cni: cilium_dualstack
      region: $(REGION_AKS_CLUSTER_TEST)
      networkType: cilium-dualstack
      installFlag: INSTALL_OVERLAY

  - stage: delete_resources
    displayName: "Delete Resources"
    pool:
      name: "$(BUILD_POOL_NAME_DEFAULT)"
    condition: always()
    dependsOn:
      - linux_overlay
      - cilium_overlay
      - linux_overlay_ds
      - cilium_overlay_ds
      - setup
    variables:
      commitID: $[ stagedependencies.setup.env.outputs['SetEnvVars.commitID'] ]
    jobs:
      - job: delete
        displayName: Delete Clusters
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - template: ../../templates/delete-cluster.yaml
            parameters:
              sub: $(SUB_AZURE_NETWORK_AGENT_BUILD_VALIDATIONS)
              svcConn: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
              suffix: -$(commitID)
              clusters:
                - kup-over
                - kup-cilover
                - kup-over-ds
                - kup-cilov-ds
