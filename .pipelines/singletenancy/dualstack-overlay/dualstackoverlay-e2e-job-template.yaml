parameters:
  - name: testBundle
    type: string
    default: full
  - name: use1ESPublishTask
    type: boolean
    default: false
  - name: name
    type: string
    default: ""
  - name: displayName
    type: string
    default: ""
  - name: clusterType
    type: string
    default: ""
  - name: clusterName
    type: string
    default: ""
  - name: vmSize
    type: string
    default: ""
  - name: k8sVersion
    type: string
    default: ""
  - name: dependsOn
    type: object
    default: ""
  - name: os
    type: string
    default: ""
  - name: scaleup
    type: string
    default: ""

stages:
  - stage: ${{ parameters.clusterName }}
    displayName: ${{ parameters.displayName }} - Create Cluster
    dependsOn: ${{ parameters.dependsOn }}
    pool:
      name: $(BUILD_POOL_NAME_DEFAULT)
      os: linux
    jobs:
      - job: ${{ parameters.name }}
        displayName: Cluster - ${{ parameters.name }}
        cancelTimeoutInMinutes: 10
        variables:
          XDG_CONFIG_HOME: $(Agent.TempDirectory)/windows-repro-config
        steps:
          - bash: |
              set -e
              mkdir -p "$XDG_CONFIG_HOME/Microsoft" "$(Build.ArtifactStagingDirectory)/windows-repro"
              for dir in "$HOME/.config" "$XDG_CONFIG_HOME" "$XDG_CONFIG_HOME/Microsoft"; do
                if [ -d "$dir" ]; then
                  stat -c '%U:%G %a %n' "$dir"
                fi
              done
            displayName: Prepare writable tool config and diagnostics
          - template: ../../templates/create-cluster-steps.yaml
            parameters:
              clusterType: ${{ parameters.clusterType }}
              clusterName: ${{ parameters.clusterName }}-$(commitID)
              vmSize: ${{ parameters.vmSize }}
              vmSizeWin: ${{ parameters.vmSize }}
              k8sVersion: ${{ parameters.k8sVersion }}
              os: ${{ parameters.os }}
              region: $(REGION_AKS_CLUSTER_TEST)
              reproRunId: $(Build.BuildId)
          - template: ../../templates/network-install.yaml
            parameters:
              clusterName: ${{ parameters.clusterName }}-$(commitID)
              networkType: azure-cni-dualstack-overlay
              azureIpamVersion: $(AZURE_IPAM_VERSION)
              cnsVersion: $(CNS_VERSION)
              cniVersion: $(CNI_VERSION)
              installFlag: INSTALL_DUALSTACK_OVERLAY
              os: ${{ parameters.os }}
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Publish Windows install diagnostics
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/windows-repro
              artifactName: ${{ parameters.clusterName }}-$(commitID)-install-diagnostics-$(System.JobAttempt)
              sbomEnabled: false
  - stage: ${{ parameters.name }}
    displayName: E2E-${{ parameters.displayName }}
    dependsOn:
    - ${{ parameters.clusterName }}
    variables:
      GOPATH: "$(Agent.TempDirectory)/go" # Go workspace path
      GOBIN: "$(GOPATH)/bin" # Go binaries path
      modulePath: "$(GOPATH)/src/github.com/Azure/azure-container-networking"
    pool:
      name: $(BUILD_POOL_NAME_DEFAULT)
      os: linux
    jobs:
      - job: ${{ parameters.name }}_${{ parameters.os }}
        displayName: DualStack Overlay Test Suite | ${{ parameters.os }} - (${{ parameters.name }})
        timeoutInMinutes: 120
        cancelTimeoutInMinutes: 10
        variables:
          XDG_CONFIG_HOME: $(Agent.TempDirectory)/windows-repro-config
        # error handled by warning-handler job below
        continueOnError: ${{ eq(parameters.os, 'windows') }}
        pool:
          name: $(BUILD_POOL_NAME_DEFAULT)
          demands:
          - agent.os -equals Linux
          - Role -equals $(CUSTOM_E2E_ROLE)
        steps:
          - bash: |
              set -e
              mkdir -p "$XDG_CONFIG_HOME/Microsoft" "$(Build.ArtifactStagingDirectory)/windows-repro"
              for dir in "$HOME/.config" "$XDG_CONFIG_HOME" "$XDG_CONFIG_HOME/Microsoft"; do
                if [ -d "$dir" ]; then
                  stat -c '%U:%G %a %n' "$dir"
                fi
              done
            displayName: Prepare writable tool config and diagnostics
          - ${{ if eq(parameters.os, 'linux') }}:
            - template: dualstackoverlay-e2e-step-template.yaml
              parameters:
                name: ${{ parameters.name }}
                clusterName: ${{ parameters.clusterName }}-$(commitID)
                os: ${{ parameters.os }}
                scaleup: ${{ parameters.scaleup }}
          - ${{ if eq(parameters.os, 'windows') }}:
            - template: ../../templates/windows-overlay-e2e-step-template.yaml
              parameters:
                name: ${{ parameters.name }}
                clusterName: ${{ parameters.clusterName }}-$(commitID)
                cniType: cniv2
                validateCniType: dualstack
                testLoadArgs: "INSTALL_DUALSTACK_OVERLAY=true VALIDATE_DUALSTACK=true"
                regionClusterTest: $(REGION_AKS_CLUSTER_TEST)
                scaleup: ${{ parameters.scaleup }}
          - template: ../../templates/k8s-e2e-step-template.yaml
            parameters:
              sub: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
              clusterName: ${{ parameters.clusterName }}-$(commitID)
              os: ${{ parameters.os }}
              dualstack: ${{ eq(parameters.os, 'linux') }} # RUN IN LINUX not WINDOWS Currently broken for scenario and blocking releases, HNS is investigating. Covered by go test in E2E step template
              dns: true
              portforward: true
              service: ${{ eq(parameters.os, 'linux') }} # RUN IN LINUX NOT WINDOWS Currently broken for scenario and blocking releases, HNS is investigating.
              hostport: true
              hybridWin: ${{ eq(parameters.os, 'windows') }}
          # Auto-injected policy tasks can mark an otherwise healthy job as
          # SucceededWithIssues. This output proves all product test steps ran.
          - bash: echo "##vso[task.setvariable variable=completed;isOutput=true]true"
            name: markE2ECompleted
            displayName: Mark E2E completed
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Publish Windows E2E diagnostics
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/windows-repro
              artifactName: ${{ parameters.clusterName }}-$(commitID)-e2e-diagnostics-$(System.JobAttempt)
              sbomEnabled: false

      # can only succeed with issues in windows
      - ${{ if eq(parameters.os, 'windows') }}:
        - template: ../../templates/warning-handler-job-template.yaml
          parameters:
            dependsOnToEmitWarning: ${{ parameters.name }}_${{ parameters.os }}
            completionOutput: markE2ECompleted.completed
            clusterName: ${{ parameters.clusterName }}-$(commitID)
            fileSearchPattern: "azure-vnet*.log"
            # known windows issues that occur only in testing:
            # - windows blue screens and writes null characters to the statefile, making it unrecoverable
            # - the hns network gets deleted outside of the cni's control, so it still thinks the network exists
            searchPattern: "\\x00|\\\\x00|hcnOpenNetwork failed in Win32: The network was not found"
            cni: cniv2
            os: windows

      - job: failedE2ELogs_${{ parameters.os }}
        displayName: "${{ parameters.os }} Failure Logs"
        dependsOn:
          - ${{ parameters.name }}_${{ parameters.os }}
        condition: in(dependencies.${{ parameters.name }}_${{ parameters.os }}.result, 'Failed', 'SucceededWithIssues')
        steps:
          - template: ../../templates/log-template.yaml
            parameters:
              use1ESPublishTask: ${{ parameters.use1ESPublishTask }}
              clusterName: ${{ parameters.clusterName }}-$(commitID)
              os: ${{ parameters.os }}
              cni: cniv2
