parameters:
  name: ""
  clusterName: ""
  os: ""
  cniType: "stateless"
  validateCniType: "stateless"
  testLoadArgs: "VALIDATE_V4OVERLAY=true INSTALL_AZURE_VNET_STATELESS=true"
  runWireserverTests: true

steps:
  - bash: |
      go version
      go env
      mkdir -p '$(GOBIN)'
      mkdir -p '$(GOPATH)/pkg'
      mkdir -p '$(modulePath)'
      echo '##vso[task.prependpath]$(GOBIN)'
      echo '##vso[task.prependpath]$(GOROOT)/bin'
    name: "GoEnv"
    displayName: "Set up the Go environment"

  - task: KubectlInstaller@0
    inputs:
      kubectlVersion: latest

  - task: AzureCLI@2
    inputs:
      azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      addSpnToEnvironment: true
      inlineScript: |
        set -e
        make -C ./hack/aks set-kubeconf AZCLI=az CLUSTER=${{ parameters.clusterName }}
    name: "kubeconfig"
    displayName: "Set Kubeconfig"

  - template: ../../templates/windows-overlay-e2e-step-template.yaml
    parameters:
      clusterName: ${{ parameters.clusterName }}
      cniType: ${{ parameters.cniType }}
      validateCniType: ${{ parameters.validateCniType }}
      testLoadArgs: ${{ parameters.testLoadArgs }}
      runWireserverTests: ${{ parameters.runWireserverTests }}
