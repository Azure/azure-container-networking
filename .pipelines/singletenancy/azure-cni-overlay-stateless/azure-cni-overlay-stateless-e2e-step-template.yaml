parameters:
  name: ""
  clusterName: ""
  os: ""

steps:
  - bash: |
      go version
      go env
      mkdir -p '$(GOBIN)'
      mkdir -p '$(GOPATH)/pkg'
      mkdir -p '$(modulePath)'
      echo '##vso[task.prependpath]$(GOBIN)'
      echo '##vso[task.prependpath]$(GOROOT)/bin'
    name: "GoEnv"
    displayName: "Set up the Go environment"

  - task: KubectlInstaller@0
    inputs:
      kubectlVersion: latest

  - task: AzureCLI@2
    inputs:
      azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      addSpnToEnvironment: true
      inlineScript: |
        set -e
        make -C ./hack/aks set-kubeconf AZCLI=az CLUSTER=${{ parameters.clusterName }}
    name: "kubeconfig"
    displayName: "Set Kubeconfig"

  - script: |
      nodeList=`kubectl get node -owide | grep Windows | awk '{print $1}'`
      for node in $nodeList; do
        taint=`kubectl describe node $node | grep Taints | awk '{print $2}'`
        if [ $taint == "node.cloudprovider.kubernetes.io/uninitialized=true:NoSchedule" ]; then
            kubectl taint nodes $node node.cloudprovider.kubernetes.io/uninitialized=true:NoSchedule-
        fi
      done
      sudo -E env "PATH=$PATH" make test-load \
        SCALE_UP=32 OS_TYPE=windows CNI_TYPE=stateless VALIDATE_STATEFILE=true VALIDATE_V4OVERLAY=true \
        INSTALL_AZURE_VNET_STATELESS=true CLEANUP=true \
        AZURE_IPAM_VERSION=$(AZURE_IPAM_VERSION) CNS_VERSION=$(CNS_VERSION) CNI_VERSION=$(CNI_VERSION) \
        IPAM_IMAGE_NAME_OVERRIDE=$(IPAM_IMAGE_NAME_OVERRIDE) CNS_IMAGE_NAME_OVERRIDE=$(CNS_IMAGE_NAME_OVERRIDE) \
        CNI_IMAGE_NAME_OVERRIDE=$(CNI_IMAGE_NAME_OVERRIDE)
    name: "WindowsOverlayControlPlaneScaleTests"
    displayName: "Windows v4Overlay ControlPlane Scale Tests"
    retryCountOnTaskFailure: 2

  - task: AzureCLI@2
    inputs:
      azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail
        kubectl get po -owide -A
        clusterName=${{ parameters.clusterName }}
        bash .pipelines/scripts/restart-windows-vmss-instances.sh "$clusterName"
    displayName: "Restart Windows Nodes One Instance at a Time"

  - task: AzureCLI@2
    inputs:
      azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail
        cd test/integration/load
        clusterName=${{ parameters.clusterName }}
        make -C ./hack/aks set-kubeconf AZCLI=az CLUSTER=${clusterName}
        kubectl get pods -owide -A
        echo "Validating Windows stateless state after node restart"
        OS_TYPE=windows CNI_TYPE=stateless VALIDATE_STATEFILE=true RESTART_CASE=true CLEANUP=true \
          go test -count=1 -timeout 30m -tags load -run ^TestValidateState$
    displayName: "Validate Windows Stateless State After Restart"

  - script: |
      echo "Post-restart IPv4 Overlay DataPath Test"
      cd test/integration/datapath
      sudo -E env "PATH=$PATH" go test -count=1 datapath_windows_test.go -timeout 12m -tags connection -run ^TestDatapathWin$
    name: "WindowsV4OverlayPostRestartDatapathTests"
    displayName: "Windows v4Overlay Post-Restart Datapath Tests"

  - script: |
      echo "Run wireserver and metadata connectivity Tests"
      bash test/network/wireserver_metadata_test.sh
    retryCountOnTaskFailure: 3
    name: "WireserverMetadataConnectivityTests"
    displayName: "Run Wireserver and Metadata Connectivity Tests"
