pr:
  branches:
    include:
      - master
      - release/*
  paths:
    include:
      - npm/*
      - .pipelines/npm/*

trigger:
  branches:
    include:
      - master
  tags:
    include:
      - "*"

parameters:
  - name: npmImage
    displayName: "NPM image override"
    type: string
    default: "__use-default__"
  - name: testLinuxArm64
    displayName: "Also run v2-background on linux/arm64 nodes (npmImage must include linux/arm64)"
    type: boolean
    default: false
  - name: testWindows
    displayName: "Also run the Windows Server 2022 leg (npmImage must include windows/amd64)"
    type: boolean
    default: false

variables:
  - name: VNET_NAME
    value: npm-vnet
  - name: NUM_PARALLEL_JOBS_FOR_STRESS_TEST
    value: "3"


stages:
  - stage: setup
    displayName: Setup
    jobs:
      - job: setup
        displayName: "Configure Test Environment"
        pool:
          name: $(BUILD_POOL_NAME_DEFAULT)
          demands:
            - agent.os -equals Linux
            - Role -equals Build
        steps:
          - checkout: self

          - script: |
              set -euo pipefail
              go version
              go env
              which go
              echo $PATH
              mkdir -p '$(GOBIN)'
              mkdir -p '$(GOPATH)/pkg'
              RG="e2e-npm-$(Build.BuildId)"
              TAG=$(make npm-version)
              . ./hack/scripts/parse_override_image.sh
              if [[ -z "${NPM_IMAGE_OVERRIDE:-}" || "$NPM_IMAGE_OVERRIDE" == "__use-default__" ]]; then
                if [[ "${TEST_LINUX_ARM64,,}" == "true" || "${TEST_WINDOWS,,}" == "true" ]]; then
                  echo "##vso[task.logissue type=error]testLinuxArm64 and testWindows need an npmImage override: the image must include linux/arm64 for testLinuxArm64 and windows/amd64 for testWindows. This pipeline only builds linux-amd64-$TAG."
                  exit 1
                fi
                NPM_IMAGE=$(format_image "$IMAGE_REGISTRY" azure-npm "linux-amd64-$TAG")
              else
                NPM_IMAGE="$NPM_IMAGE_OVERRIDE"
              fi
              echo "Resource group: $RG"
              echo "Image tag: $TAG"
              echo "NPM image: $NPM_IMAGE"

              echo "##vso[task.setvariable variable=RESOURCE_GROUP;isOutput=true;]$RG"
              echo "##vso[task.setvariable variable=TAG;isOutput=true;]$TAG"
              echo "##vso[task.setvariable variable=NPM_IMAGE;isOutput=true;]$NPM_IMAGE"

            name: "EnvironmentalVariables"
            displayName: "Set environmental variables"
            condition: always()
            env:
              NPM_IMAGE_OVERRIDE: ${{ parameters.npmImage }}
              TEST_LINUX_ARM64: ${{ parameters.testLinuxArm64 }}
              TEST_WINDOWS: ${{ parameters.testWindows }}

  - ${{ if or(eq(parameters.npmImage, '__use-default__'), eq(parameters.npmImage, '')) }}:
    - stage: build
      displayName: Build Resources
      dependsOn: [setup]
      jobs:
      - job: containerize
        displayName: Build Images
        variables:
          TAG: $[ stagedependencies.setup.setup.outputs['EnvironmentalVariables.TAG'] ]
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        strategy:
          matrix:
            npm_linux_amd64:
              arch: amd64
              name: npm
              os: linux
        steps:
          - template: ../containers/container-template.yaml
            parameters:
              arch: $(arch)
              name: $(name)
              os: $(os)

  - stage: Create_Cluster_and_Run_Test
    displayName: NPM Conformance
    dependsOn:
      - setup
      - ${{ if or(eq(parameters.npmImage, '__use-default__'), eq(parameters.npmImage, '')) }}:
        - build
    jobs:
    - job: Create_Cluster_and_Run_Test
      timeoutInMinutes: 360
      displayName: "Run Kubernetes Network Policy Test Suite"
      strategy:
        matrix:
          v2-foreground:
            AZURE_CLUSTER: "conformance-v2-foreground"
            PROFILE: "v2-foreground"
            NPM_CONFIG_PROFILE: "v2-foreground"
            IS_STRESS_TEST: "false"
          v2-background:
            AZURE_CLUSTER: "conformance-v2-background"
            PROFILE: "v2-background"
            NPM_CONFIG_PROFILE: "v2-background"
            IS_STRESS_TEST: "false"
          v2-linux-stress:
            AZURE_CLUSTER: "conformance-v2-linux-stress"
            PROFILE: "v2-linux-stress"
            NPM_CONFIG_PROFILE: "v2-background"
            IS_STRESS_TEST: "true"
          v2-place-first:
            AZURE_CLUSTER: "conformance-v2-place-first"
            PROFILE: "v2-place-first"
            NPM_CONFIG_PROFILE: "v2-place-first"
            IS_STRESS_TEST: "false"
          ${{ if eq(parameters.testLinuxArm64, true) }}:
            v2-background-arm64:
              AZURE_CLUSTER: "conformance-v2-background-arm64"
              PROFILE: "v2-background-arm64"
              NPM_CONFIG_PROFILE: "v2-background"
              IS_STRESS_TEST: "false"
              NODE_VM_SIZE: "Standard_D4ps_v5"
              EXPECTED_NODE_ARCH: "arm64"
          ${{ if eq(parameters.testWindows, true) }}:
            v2-ws22:
              AZURE_CLUSTER: "conformance-v2-ws22"
              PROFILE: "v2-ws22"
              IS_STRESS_TEST: "false"
              IS_WINDOWS: "true"
      pool:
        name: $(BUILD_POOL_NAME_DEFAULT)
        demands:
          - agent.os -equals Linux
          - Role -equals Build
      variables:
        RESOURCE_GROUP: $[ stagedependencies.setup.setup.outputs['EnvironmentalVariables.RESOURCE_GROUP'] ]
        NPM_IMAGE: $[ stagedependencies.setup.setup.outputs['EnvironmentalVariables.NPM_IMAGE'] ]
        KUBECONFIG: $(Agent.TempDirectory)/npm-$(Build.BuildId)-$(System.JobId).kubeconfig
        FQDN: empty
        PUBLIC_IP_NAME: $(RESOURCE_GROUP)-$(PROFILE)-public-ip
      steps:
        - checkout: self

        - task: AzureCLI@2
          displayName: "Create resource group"
          inputs:
            azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
            scriptType: "bash"
            scriptLocation: "inlineScript"
            inlineScript: |
              set -euo pipefail
              az group create -n $(RESOURCE_GROUP) -l $(LOCATION) -o table
              echo created RG $(RESOURCE_GROUP) in $(LOCATION)
              az version

        - task: AzureCLI@2
          displayName: "Create public IP with a service tag"
          inputs:
            azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
            scriptType: "bash"
            scriptLocation: "inlineScript"
            inlineScript: |
              az network public-ip create \
                --name $(PUBLIC_IP_NAME) \
                --resource-group $(RESOURCE_GROUP) \
                --allocation-method Static \
                --ip-tags 'FirstPartyUsage=/DelegatedNetworkControllerTest' \
                --location $(LOCATION) \
                --sku Standard \
                --tier Regional \
                --version IPv4

        - task: AzureCLI@2
          displayName: "Deploy NPM to Test Cluster"
          inputs:
            azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
            scriptType: "bash"
            scriptLocation: "inlineScript"
            inlineScript: |
              set -euo pipefail
              IS_WINDOWS="${IS_WINDOWS:-false}"
              NODE_VM_SIZE="${NODE_VM_SIZE:-}"
              EXPECTED_NODE_ARCH="${EXPECTED_NODE_ARCH:-}"
              if [[ "$IS_WINDOWS" == "true" ]]; then
                # the Windows manifest bundles its own azure-npm-config ConfigMap, so no NPM config profile is applied
                NPM_DAEMONSET="azure-npm-win"
              else
                NPM_DAEMONSET="azure-npm"
                NPM_CONFIG_PATH="$(Pipeline.Workspace)/s/npm/profiles/$NPM_CONFIG_PROFILE.yaml"
                if [[ ! -f "$NPM_CONFIG_PATH" ]]; then
                  echo "NPM config profile not found: $NPM_CONFIG_PATH" >&2
                  exit 1
                fi
              fi

              # get kubectl
              curl -LO https://dl.k8s.io/release/v1.23.0/bin/linux/amd64/kubectl
              chmod +x kubectl
              echo Cluster $(AZURE_CLUSTER)
              echo Resource $(RESOURCE_GROUP)
              echo Public IP $(PUBLIC_IP_NAME)
              PUBLIC_IP_ID=$(az network public-ip show -g $(RESOURCE_GROUP) -n $(PUBLIC_IP_NAME) --query id -o tsv)
              echo Public IP ID $PUBLIC_IP_ID

              if [[ "$IS_WINDOWS" == "true" ]]; then
                echo "Creating Windows Server 2022 Cluster";
                az aks create --no-ssh-key \
                --resource-group $(RESOURCE_GROUP) \
                --name $(AZURE_CLUSTER) \
                --network-plugin azure \
                --vm-set-type VirtualMachineScaleSets \
                --node-vm-size Standard_D4s_v3 \
                --node-count 1 \
                --load-balancer-outbound-ips "$PUBLIC_IP_ID"

                # keep test pods off the Linux system pool
                az aks nodepool update \
                --resource-group $(RESOURCE_GROUP) \
                --cluster-name $(AZURE_CLUSTER) \
                --name nodepool1 \
                --node-taints CriticalAddonsOnly=true:NoSchedule

                az aks nodepool add \
                --resource-group $(RESOURCE_GROUP) \
                --cluster-name $(AZURE_CLUSTER) \
                --name awin22 \
                --os-type Windows \
                --os-sku Windows2022 \
                --node-vm-size Standard_D4s_v3 \
                --node-count 2
              else
                echo "Creating Linux Cluster";
                nodeVMSizeArgs=()
                if [[ -n "$NODE_VM_SIZE" ]]; then
                  nodeVMSizeArgs=(--node-vm-size "$NODE_VM_SIZE")
                fi
                az aks create --no-ssh-key \
                --resource-group $(RESOURCE_GROUP) \
                --name $(AZURE_CLUSTER) \
                --network-plugin azure \
                --load-balancer-outbound-ips "$PUBLIC_IP_ID" \
                "${nodeVMSizeArgs[@]}"
              fi

              az aks get-credentials -n $(AZURE_CLUSTER) -g $(RESOURCE_GROUP) --file "$KUBECONFIG"

              if [[ -n "$EXPECTED_NODE_ARCH" ]]; then
                ./kubectl --kubeconfig="$KUBECONFIG" get nodes -L kubernetes.io/arch
                NODE_ARCHS=$(./kubectl --kubeconfig="$KUBECONFIG" get nodes -o 'jsonpath={.items[*].status.nodeInfo.architecture}')
                for arch in ${NODE_ARCHS:-none}; do
                  if [[ "$arch" != "$EXPECTED_NODE_ARCH" ]]; then
                    echo "Node architecture mismatch: expected every node to be '$EXPECTED_NODE_ARCH', got '${NODE_ARCHS:-no nodes}'" >&2
                    exit 1
                  fi
                done
              fi

              # deploy azure-npm
              if [[ "$IS_WINDOWS" == "true" ]]; then
                ./kubectl --kubeconfig="$KUBECONFIG" apply -f $(Pipeline.Workspace)/s/npm/examples/windows/azure-npm.yaml
                ./kubectl --kubeconfig="$KUBECONFIG" set image daemonset/azure-npm-win -n kube-system "azure-npm=$NPM_IMAGE"
              else
                ./kubectl --kubeconfig="$KUBECONFIG" apply -f $(Pipeline.Workspace)/s/npm/azure-npm.yaml

                ./kubectl --kubeconfig="$KUBECONFIG" set image daemonset/azure-npm -n kube-system "azure-npm=$NPM_IMAGE"

                ./kubectl --kubeconfig="$KUBECONFIG" apply -f "$NPM_CONFIG_PATH"
                ./kubectl --kubeconfig="$KUBECONFIG" rollout restart ds azure-npm -n kube-system
              fi
              ./kubectl --kubeconfig="$KUBECONFIG" rollout status ds "$NPM_DAEMONSET" -n kube-system --timeout=20m

              DEPLOYED_NPM_IMAGE=$(./kubectl --kubeconfig="$KUBECONFIG" get daemonset "$NPM_DAEMONSET" -n kube-system -o 'jsonpath={.spec.template.spec.containers[?(@.name=="azure-npm")].image}')
              if [[ "$DEPLOYED_NPM_IMAGE" != "$NPM_IMAGE" ]]; then
                echo "NPM image mismatch: expected '$NPM_IMAGE', got '$DEPLOYED_NPM_IMAGE'" >&2
                exit 1
              fi
              echo "NPM image: $DEPLOYED_NPM_IMAGE"
              if [[ "$IS_WINDOWS" == "true" ]]; then
                echo "NPM config: azure-npm-config from npm/examples/windows/azure-npm.yaml"
              else
                echo "NPM config profile: $NPM_CONFIG_PROFILE"
              fi
              ./kubectl --kubeconfig="$KUBECONFIG" get pods -n kube-system -l k8s-app=azure-npm \
                -o 'custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,IMAGE:.spec.containers[*].image,IMAGE_ID:.status.containerStatuses[*].imageID'
              ./kubectl --kubeconfig="$KUBECONFIG" describe daemonset "$NPM_DAEMONSET" -n kube-system

              if [[ "$IS_WINDOWS" == "true" ]]; then
                WINDOWS_NODES=$(./kubectl --kubeconfig="$KUBECONFIG" get nodes -l kubernetes.io/os=windows -o name | wc -l)
                READY_NPM_PODS=$(./kubectl --kubeconfig="$KUBECONFIG" get daemonset azure-npm-win -n kube-system -o 'jsonpath={.status.numberReady}')
                if [[ "$WINDOWS_NODES" -eq 0 || "${READY_NPM_PODS:-0}" -ne "$WINDOWS_NODES" ]]; then
                  echo "Expected a ready azure-npm-win pod on each of the $WINDOWS_NODES Windows nodes, got ${READY_NPM_PODS:-0}" >&2
                  exit 1
                fi
                echo "Waiting 3 minutes for Windows NPM to finish its bootup phase"
                sleep 180
              fi

              FQDN=`az aks show -n $(AZURE_CLUSTER) -g $(RESOURCE_GROUP) --query fqdn -o tsv`
              echo "##vso[task.setvariable variable=FQDN]$FQDN"
          env:
            NPM_IMAGE: $(NPM_IMAGE)

        - task: AzureCLI@2
          inputs:
            azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
            scriptLocation: "inlineScript"
            scriptType: "bash"
            addSpnToEnvironment: true
            inlineScript: |
              set -e

              if [ $(PROFILE) == "v2-place-first" ]; then
                git clone --depth=1 --branch=huntergregory/service-types https://github.com/huntergregory/network-policy-api.git
                cd network-policy-api/cmd/policy-assistant
                make policy-assistant
                cd ../../..
                mv network-policy-api/cmd/policy-assistant/cmd/policy-assistant/policy-assistant .
              else
                # sig-release provides test suite tarball(s) per k8s release. Just need to provide k8s version "v1.xx.xx"
                # pulling k8s version from AKS.
                eval k8sVersion="v"$( az aks show -g $(RESOURCE_GROUP) -n $(AZURE_CLUSTER) --query "currentKubernetesVersion")
                echo $k8sVersion
                curl -L https://dl.k8s.io/$k8sVersion/kubernetes-test-linux-amd64.tar.gz -o ./kubernetes-test-linux-amd64.tar.gz

                # https://github.com/kubernetes/sig-release/blob/master/release-engineering/artifacts.md#content-of-kubernetes-test-system-archtargz-on-example-of-kubernetes-test-linux-amd64targz-directories-removed-from-list
                # explictly unzip and strip directories from ginkgo and e2e.test
                tar -xvzf kubernetes-test-linux-amd64.tar.gz --strip-components=3 kubernetes/test/bin/ginkgo kubernetes/test/bin/e2e.test
              fi

          displayName: "Setup Environment"

        - bash: |
            set -o pipefail

            ## create the output folder and include the kubeconfig there
            npmLogsFolder=$(System.DefaultWorkingDirectory)/npmLogs_$(AZURE_CLUSTER)
            mkdir -p $npmLogsFolder
            cp "$KUBECONFIG" "$npmLogsFolder/kubeconfig"

            npmPodList=`kubectl --kubeconfig="$KUBECONFIG" get pods -n kube-system | grep npm | awk '{print $1}'`
            echo "Found NPM pods: $npmPodList"

            ## Run all Conformance tests in the background
            echo $FQDN

            runConformance () {
                local -a seedArgs=()
                if [[ $# -gt 0 ]]; then
                  seedArgs=(--ginkgo.seed="$1")
                fi
                if [ $(PROFILE) == "v2-place-first" ]; then
                  # 15 minute timeout for creating LoadBalancer with Azure-internal "external IPs"
                  ./policy-assistant generate --noisy=true --job-timeout-seconds=2 --pod-creation-timeout-seconds 900 --server-protocol TCP,UDP --ignore-loopback --include special-services --exclude cni-brings-source-pod-info-to-other-node
                elif [[ "${IS_WINDOWS:-false}" == "true" ]]; then
                  runConformanceWindows "${seedArgs[@]}"
                else
                  KUBERNETES_SERVICE_HOST="$FQDN" KUBERNETES_SERVICE_PORT=443 ./e2e.test --provider=local --ginkgo.focus="NetworkPolicy" --ginkgo.skip="SCTP" --kubeconfig="$KUBECONFIG" "${seedArgs[@]}"
                fi
                # there can't be a command after e2e.test/policy-assistant because the exit code is important
            }

            runConformanceWindows () {
                # the full suite takes too long on Windows, so run the 14 tests the ws22 leg ran before #3888 removed it
                # NetworkPolicy between server and...
                local f1="client should enforce policy to allow traffic only from a different namespace, based on NamespaceSelector"
                local f2="client should deny egress from pods based on PodSelector"
                local f3="client should enforce multiple, stacked policies with overlapping podSelectors"
                local f4="client should enforce egress policy allowing traffic to a server in a different namespace based on PodSelector and NamespaceSelector"
                local f5="client should work with Ingress, Egress specified together"
                local f6="client should enforce ingress policy allowing any port traffic to a server on a specific protocol"
                local f7="client should not allow access by TCP when a policy specifies only UDP"
                local f8="client should allow egress access to server in CIDR block"
                local f9="client should enforce policy based on Ports"
                local f10="client should support allow-all policy"
                local f11="client should enforce updated policy"
                local f12="client should support denying of egress traffic on the client side"
                local f13="client should stop enforcing policies after they are deleted"
                local f14="client should support a 'default-deny-ingress' policy"
                local focus="$f1|$f2|$f3|$f4|$f5|$f6|$f7|$f8|$f9|$f10|$f11|$f12|$f13|$f14"
                # --allowed-not-ready-nodes=1 tolerates the tainted Linux system node
                KUBERNETES_SERVICE_HOST="$FQDN" KUBERNETES_SERVICE_PORT=443 \
                  ./e2e.test \
                  --provider=local \
                  --ginkgo.focus="$focus" \
                  --ginkgo.skip="\[LinuxOnly\]|NetworkPolicyLegacy|SCTP" \
                  --node-os-distro=windows \
                  --allowed-not-ready-nodes=1 \
                  --kubeconfig="$KUBECONFIG" \
                  --ginkgo.timeout="4h" \
                  "$@"
            }

            exitCode=0
            if [ $(IS_STRESS_TEST) == "true" ]; then
                echo "Running $NUM_PARALLEL_JOBS_FOR_STRESS_TEST conformance tests at once and writing outputs to files"
                declare -a conformancePIDs
                baseSeed=$(date +%s)
                for round in $(seq 1 $NUM_PARALLEL_JOBS_FOR_STRESS_TEST); do
                    # for each iteration, run the conformance test and echos in the background, and write the output of the conformance test to a file

                    # run the conformance test in the foreground and write the output to stdout and a file
                    echo "starting conformance test #$round" && \
                        runConformance $((baseSeed + round)) > $npmLogsFolder/conformance-results-$round && \
                        echo "finished conformance test #$round" &
                    pidOfConformanceTest=$!
                    conformancePIDs+=($pidOfConformanceTest)
                done

                # wait until all conformance tests finish and take note of any failed tests
                for round in $(seq 1 $NUM_PARALLEL_JOBS_FOR_STRESS_TEST); do
                    i=$((round-1))
                    wait ${conformancePIDs[$i]}
                    exitCode=$?
                    if [ $exitCode != 0 ]; then
                        echo "conformance test #$round failed"
                        break
                    fi
                done
            else
              # run the conformance test in the foreground and write the output to stdout and a file
              runConformance | tee $npmLogsFolder/conformance-results
              exitCode=$?
            fi

            # get all current npm pods
            kubectl --kubeconfig="$KUBECONFIG" get pods -n kube-system | grep npm
            npmPodList=`kubectl --kubeconfig="$KUBECONFIG" get pods -n kube-system | grep npm | awk '{print $1}'`
            # capture all logs
            for npmPod in $npmPodList; do
                ./kubectl --kubeconfig="$KUBECONFIG" logs -n kube-system $npmPod > $npmLogsFolder/$npmPod-logs.txt
            done

            # capture any previous logs in case there was a crash
            for npmPod in $npmPodList; do
                previousLogFile=$npmLogsFolder/previous-$npmPod-logs.txt
                ./kubectl --kubeconfig="$KUBECONFIG" logs -n kube-system $npmPod -p > $previousLogFile
                if [[ $? -ne 0 ]]; then
                    # remove the empty file if kubectl logs failed (e.g. there was no previous terminated container)
                    rm $previousLogFile
                fi
            done

            exit $exitCode
          displayName: "Run Test Suite and Get Logs ($(PROFILE))"
          failOnStderr: false

        - publish: $(System.DefaultWorkingDirectory)/npmLogs_$(AZURE_CLUSTER)
          condition: always()
          artifact: NpmLogs_$(AZURE_CLUSTER)

  - stage: clean_up_Create_Cluster_and_Run_Test
    displayName: Cleanup Conformance
    dependsOn: [setup, Create_Cluster_and_Run_Test]
    condition: always()
    jobs:
    - job: clean_up
      displayName: "Cleanup"
      pool:
        name: $(BUILD_POOL_NAME_DEFAULT)
        demands:
          - agent.os -equals Linux
          - Role -equals Build
      variables:
        RESOURCE_GROUP: $[ stagedependencies.setup.setup.outputs['EnvironmentalVariables.RESOURCE_GROUP'] ]
      steps:
        - checkout: none
        - task: AzureCLI@2
          displayName: "Delete Test Cluster Resource Group"
          inputs:
            azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
            scriptType: "bash"
            scriptLocation: "inlineScript"
            inlineScript: |
              echo Deleting $(RESOURCE_GROUP)
              az group delete -n $(RESOURCE_GROUP) --yes
