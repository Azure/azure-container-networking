parameters:
  arch: ""
  name: ""
  os: ""

steps:
- task: AzureCLI@2
  displayName: "Login"
  inputs:
    azureSubscription: $(ACR_ARM_SERVICE_CONNECTION)
    scriptLocation: "inlineScript"
    scriptType: "bash"
    inlineScript: |
      az acr login -n $(ACR)

- template: ../templates/disk-cleanup.steps.yaml

- script: |
    set -e
    echo "=== Disk space BEFORE make image ==="
    df -h
    make ${{ parameters.name }}-image OS=${{ parameters.os }} ARCH=${{ parameters.arch }}
    echo "=== Disk space AFTER make image ==="
    df -h
  name: image_build
  displayName: Image Build
  retryCountOnTaskFailure: 2
  env:
    # Buildah pushes separately and ignores this Docker buildx setting.
    BUILDX_ACTION: --push --provenance=false

- script: |
    set -euo pipefail
    image=$(make --no-print-directory npm-image-name-and-tag OS=${{ parameters.os }} ARCH=${{ parameters.arch }})
    bash hack/scripts/test_npm_image.sh "$image"
  displayName: Validate NPM Linux image runtime
  condition: and(succeeded(), eq(variables['name'], 'npm'), eq(variables['os'], 'linux'))

- task: AzureCLI@2
  displayName: "Logout"
  inputs:
    azureSubscription: $(ACR_ARM_SERVICE_CONNECTION)
    scriptLocation: "inlineScript"
    scriptType: "bash"
    inlineScript: |
      docker logout
