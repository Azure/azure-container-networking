parameters:
  arch: ""
  name: ""
  os: ""

steps:
- task: AzureCLI@2
  displayName: "Login"
  inputs:
    azureSubscription: $(ACR_ARM_SERVICE_CONNECTION)
    scriptLocation: "inlineScript"
    scriptType: "bash"
    inlineScript: |
      az acr login -n $(ACR)

- template: ../templates/disk-cleanup.steps.yaml

- script: |
    set -e
    echo "=== Disk space BEFORE make image ==="
    df -h
    make ${{ parameters.name }}-image OS=${{ parameters.os }} ARCH=${{ parameters.arch }}
    echo "=== Disk space AFTER make image ==="
    df -h
  name: image_build
  displayName: Image Build
  retryCountOnTaskFailure: 2
  env:
    # The Makefile prefers buildah when the binary is present. Azure Linux agents
    # ship buildah without netavark or subuid/subgid, so image builds fail there.
    # Only the build needs docker; manifest jobs still use buildah.
    CONTAINER_BUILDER: docker
    # buildah pushes as part of the build, buildx does not. Push here as well so
    # the manifest stage can find every platform tag in the registry.
    # --provenance=false keeps buildx from wrapping the image in an index, which
    # `buildah manifest add` cannot resolve for a non-host architecture.
    BUILDX_ACTION: --push --provenance=false

- task: AzureCLI@2
  displayName: "Logout"
  inputs:
    azureSubscription: $(ACR_ARM_SERVICE_CONNECTION)
    scriptLocation: "inlineScript"
    scriptType: "bash"
    inlineScript: |
      docker logout
