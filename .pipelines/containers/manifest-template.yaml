parameters:
  name: ""
  platforms: ""
  # Callers that extend 1ES PT must declare the artifact via templateContext.outputs
  # instead, because 1ES disallows publish tasks inside steps.
  publishArtifact: true

steps:

  - task: AzureCLI@2
    displayName: "Login"
    inputs:
      azureSubscription: $(ACR_ARM_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      inlineScript: |
        az acr login -n $(ACR)

  - script: |
      set -e
      make ${{ parameters.name }}-manifest-build PLATFORMS="${{ parameters.platforms }}" 
    name: manifest_build
    displayName: Manifest Build
    retryCountOnTaskFailure: 3

  - script: |
      set -ex
      echo "checking XDG_RUNTIME_DIR"
      echo $XDG_RUNTIME_DIR
      make ${{ parameters.name }}-manifest-push
      mkdir -p $(Build.ArtifactStagingDirectory)/images

      echo "setting XDG_RUNTIME_DIR"
      export XDG_RUNTIME_DIR=/run/user/$(id -u)
      echo $XDG_RUNTIME_DIR

      make ${{ parameters.name }}-skopeo-archive IMAGE_ARCHIVE_DIR=$(Build.ArtifactStagingDirectory)/images
    name: manifest_push
    displayName: Manifest Push
    retryCountOnTaskFailure: 3

  - task: AzureCLI@2
    displayName: "Logout"
    inputs:
      azureSubscription: $(ACR_ARM_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      inlineScript: |
        docker logout

  - ${{ if eq(parameters.publishArtifact, true) }}:
      - task: PublishBuildArtifacts@1
        inputs:
          artifactName: "output_staging"
          pathtoPublish: "$(Build.ArtifactStagingDirectory)"
        condition: succeeded()
