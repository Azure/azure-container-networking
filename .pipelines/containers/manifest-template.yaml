parameters:
  name: ""
  platforms: ""

steps:

  - task: AzureCLI@2
    displayName: "Login"
    inputs:
      azureSubscription: $(ACR_ARM_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      inlineScript: |
        az acr login -n $(ACR)

  - script: |
      set -e
      command -v buildah
      make ${{ parameters.name }}-manifest-build CONTAINER_BUILDER=buildah PLATFORMS="${{ parameters.platforms }}" '.SHELLFLAGS=-ec'
    name: manifest_build
    displayName: Manifest Build
    retryCountOnTaskFailure: 3

  - script: |
      set -exo pipefail
      echo "checking XDG_RUNTIME_DIR"
      echo $XDG_RUNTIME_DIR
      make ${{ parameters.name }}-manifest-push CONTAINER_BUILDER=buildah
      image="$(make -s ${{ parameters.name }}-image-name)"
      version="$(make -s ${{ parameters.name }}-version)"
      skopeo inspect --raw "docker://${IMAGE_REGISTRY}/${image}:${version}" |
        jq -e --arg platforms "${{ parameters.platforms }}" '
          [.manifests[].platform | .os + "/" + .architecture] | unique |
          if . == ($platforms | split(" ") | unique) then .
          else error("Published image platforms do not match: " + $platforms) end'
      mkdir -p $(Build.ArtifactStagingDirectory)/images

      echo "setting XDG_RUNTIME_DIR"
      export XDG_RUNTIME_DIR=/run/user/$(id -u)
      echo $XDG_RUNTIME_DIR

      make ${{ parameters.name }}-skopeo-archive IMAGE_ARCHIVE_DIR=$(Build.ArtifactStagingDirectory)/images
    name: manifest_push
    displayName: Manifest Push
    retryCountOnTaskFailure: 3

  - task: AzureCLI@2
    displayName: "Logout"
    inputs:
      azureSubscription: $(ACR_ARM_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      inlineScript: |
        docker logout
