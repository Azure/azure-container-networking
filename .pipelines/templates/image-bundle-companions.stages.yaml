parameters:
  - name: testBundle
    type: string
    default: full
  - name: images
    type: object
  - name: suites
    type: object

stages:
  - template: image-bundle-build-plan.stages.yaml
    parameters:
      testBundle: ${{ parameters.testBundle }}
      suites: ${{ parameters.suites }}
      images: ${{ parameters.images }}
      useImageOverrides: ${{ or(eq(parameters.testBundle, 'images'), notIn(parameters.images.cni, '', '__use-default__'), notIn(parameters.images['cns'], '', '__use-default__'), notIn(parameters.images['azure-ipam'], '', '__use-default__'), notIn(parameters.images['azure-iptables-monitor'], '', '__use-default__'), notIn(parameters.images['azure-ip-masq-merger'], '', '__use-default__'), notIn(parameters.images['cilium-log-collector'], '', '__use-default__'), notIn(parameters.images['ipv6-hp-bpf'], '', '__use-default__')) }}
      consumedImages:
        - ${{ each suite in parameters.suites }}:
          - ${{ each image in suite.images }}:
            - ${{ image }}
