parameters:
  name: ""
  clusterName: ""
  cniType: "cniv2"                                    # CNI_TYPE for make test-load (cniv2 or stateless)
  validateCniType: "cniv2"                            # CNI_TYPE for make test-validate-state (cniv2, stateless, or dualstack)
  testLoadArgs: ""                                    # Extra validation args for make test-load (e.g. "VALIDATE_V4OVERLAY=true")
  regionClusterTest: "$(REGION_AKS_CLUSTER_TEST)"
  scaleup: "32"
  runWireserverTests: "false"

steps:
  - bash: |
      go version
      go env
      mkdir -p '$(GOBIN)'
      mkdir -p '$(GOPATH)/pkg'
      mkdir -p '$(modulePath)'
      echo '##vso[task.prependpath]$(GOBIN)'
      echo '##vso[task.prependpath]$(GOROOT)/bin'
    name: "GoEnv"
    displayName: "Set up the Go environment"

  - task: KubectlInstaller@0
    inputs:
      kubectlVersion: latest

  - task: AzureCLI@2
    inputs:
      azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      addSpnToEnvironment: true
      inlineScript: |
        set -e
        make -C ./hack/aks set-kubeconf AZCLI=az CLUSTER=${{ parameters.clusterName }}
    name: "kubeconfig"
    displayName: "Set Kubeconfig"

  - task: AzureCLI@2
    inputs:
      azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      addSpnToEnvironment: true
      inlineScript: |
        set -e
        clusterName=${{ parameters.clusterName }}

        # set cni name to azure so windows cleanup script runs (though testing can still pass without this usually)
        cd hack/scripts
        bash patch-kubeclusterconfig.sh || true
        cd ../..

        # Keep the sampler separate from the privileged DaemonSet used by the tests.
        if [[ "${WINDOWS_OVERLAY_DIAGNOSTICS:-false}" == "true" ]]; then
          diag_ds="windows-overlay-snapshot-$(System.JobAttempt)-$RANDOM"
          diag_kubectl() {
            timeout 20s kubectl --request-timeout=15s -n kube-system "$@"
          }
          diag_logs() {
            local phase=$1 pods pod node
            shift
            echo "Windows overlay snapshot phase=$phase utc=$(date -u +%FT%TZ)"
            if ! pods=$(diag_kubectl get pods -l "app=$diag_ds" --no-headers \
              -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName) || [[ -z "$pods" ]]; then
              echo "No diagnostic pods available at phase=$phase"
              return 0
            fi
            while read -r pod node; do
              echo "Windows overlay snapshot phase=$phase node=$node"
              diag_kubectl logs "$pod" "$@" || echo "Snapshot unavailable for $node at phase=$phase"
            done <<< "$pods"
          }
          if diag_script=$(iconv -f UTF-8 -t UTF-16LE hack/scripts/windows-overlay-snapshot.ps1 | base64 -w0) &&
            diag_kubectl create --dry-run=client -o json \
            -f test/integration/manifests/load/privileged-daemonset-windows.yaml |
            jq --arg name "$diag_ds" --arg script "$diag_script" '
              .metadata.name = $name |
              .metadata.labels.app = $name |
              .spec.selector.matchLabels.app = $name |
              .spec.template.metadata.labels.app = $name |
              .spec.template.spec.containers[0].command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-EncodedCommand", $script]' |
            diag_kubectl create -f -; then
            diag_active=true
            diag_finish() {
              local test_status=$?
              if (( test_status != 0 )); then
                if [[ "${diag_load_captured:-false}" == "true" ]]; then
                  diag_logs failure --since=2m
                else
                  diag_logs failure --since-time="$diag_reboot_utc"
                fi
              fi
              diag_kubectl delete ds "$diag_ds" --wait=false || echo "Could not delete the diagnostic DaemonSet"
              return "$test_status"
            }
            diag_reboot_utc=$(date -u +%FT%TZ)
            trap diag_finish EXIT
            diag_kubectl rollout status "ds/$diag_ds" --timeout=12s || echo "Diagnostic pods not yet ready"
            diag_logs before-reboot --tail=1
            diag_reboot_utc=$(date -u +%FT%TZ)
          else
            echo "Could not start the Windows overlay sampler; continuing with the existing tests"
          fi
        fi

        # Restart nodes
        echo "Restarting nodes"
        kubectl get po -owide -A
        for val in $(az vmss list -g MC_${clusterName}_${clusterName}_${{ parameters.regionClusterTest }} --query "[].name" -o tsv); do
          make -C ./hack/aks restart-vmss AZCLI=az CLUSTER=${clusterName} REGION=${{ parameters.regionClusterTest }} VMSS_NAME=${val}
        done
        if [[ "${diag_active:-false}" == "true" ]]; then
          diag_logs after-reboot --since-time="$diag_reboot_utc" --tail=1
        fi

        # Remove taints from Windows nodes
        nodeList=`kubectl get node -owide | grep Windows | awk '{print $1}'`
        for node in $nodeList; do
            taint=`kubectl describe node $node | grep Taints | awk '{print $2}'`
            if [ $taint == "node.cloudprovider.kubernetes.io/uninitialized=true:NoSchedule" ]; then
                kubectl taint nodes $node node.cloudprovider.kubernetes.io/uninitialized=true:NoSchedule-
            fi
        done

        # Run control plane scale tests
        # These vars may be set by the job template via setup stage outputs and are available here as environment variables in child scripts.

        IPAM=${AZURE_IPAM_VERSION:-$(make azure-ipam-version)}
        CNS=${CNS_VERSION:-$(make cns-version)}
        CNI=${CNI_VERSION:-$(make cni-version)}
        if [[ "${diag_active:-false}" == "true" ]]; then
          echo "Windows overlay CNI install/load start utc=$(date -u +%FT%TZ)"
        fi
        sudo -E env "PATH=$PATH" make test-load SCALE_UP=${{ parameters.scaleup }} OS_TYPE=windows CNI_TYPE=${{ parameters.cniType }} VALIDATE_STATEFILE=true ${{ parameters.testLoadArgs }} AZURE_IPAM_VERSION=${IPAM} CNS_VERSION=${CNS} CNI_VERSION=${CNI} CLEANUP=true
        if [[ "${diag_active:-false}" == "true" ]]; then
          diag_logs reboot-through-cni-install --since-time="$diag_reboot_utc"
          diag_load_captured=true
        fi

        # Run datapath tests
        echo "Windows Overlay DataPath Test"
        cd test/integration/datapath
        sudo -E env "PATH=$PATH" go test -count=1 datapath_windows_test.go -timeout 12m -tags connection -restartKubeproxy true -run ^TestDatapathWin$
    name: "WindowsOverlayTests"
    displayName: "Windows Overlay ControlPlane and DataPath Tests"
    retryCountOnTaskFailure: 2
    ${{ if ne(parameters.validateCniType, 'dualstack') }}:
      env:
        WINDOWS_OVERLAY_DIAGNOSTICS: "true"

  - task: AzureCLI@2
    inputs:
      azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
      scriptLocation: "inlineScript"
      scriptType: "bash"
      addSpnToEnvironment: true
      inlineScript: |
        set -e
        clusterName=${{ parameters.clusterName }}

        # set cni name to azure so windows cleanup script runs (though testing can still pass without this usually)
        cd hack/scripts
        bash patch-kubeclusterconfig.sh || true
        cd ../..

        # Restart nodes
        echo "Restarting nodes"
        kubectl get po -owide -A
        for val in $(az vmss list -g MC_${clusterName}_${clusterName}_${{ parameters.regionClusterTest }} --query "[].name" -o tsv); do
          make -C ./hack/aks restart-vmss AZCLI=az CLUSTER=${clusterName} REGION=${{ parameters.regionClusterTest }} VMSS_NAME=${val}
        done

        # Scale Cluster Up/Down to confirm functioning CNS
        cd test/integration/load
        ITERATIONS=2 SCALE_UP=${{ parameters.scaleup }} OS_TYPE=windows go test -count 1 -timeout 30m -tags load -run ^TestLoad$
        kubectl get pods -owide -A

        cd ../../..
        echo "Validating Node Restart"
        make test-validate-state OS_TYPE=windows RESTART_CASE=true CNI_TYPE=${{ parameters.validateCniType }}
        kubectl delete ns load-test
    name: "WindowsOverlayValidateRestart"
    displayName: "Validate Windows Overlay Node Restart"
    retryCountOnTaskFailure: 2

  - ${{ if eq(parameters.runWireserverTests, 'true') }}:
    - task: AzureCLI@2
      inputs:
        azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
        scriptLocation: inlineScript
        scriptType: bash
        inlineScript: |
          echo "Run wireserver and metadata connectivity Tests"
          bash test/network/wireserver_metadata_test.sh
      retryCountOnTaskFailure: 3
      name: "WireserverMetadataConnectivityTests"
      displayName: "Run Wireserver and Metadata Connectivity Tests"
