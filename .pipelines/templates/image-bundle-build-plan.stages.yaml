parameters:
  - name: testBundle
    type: string
  - name: suites
    type: object
  - name: images
    type: object
  - name: consumedImages
    type: object
  - name: useImageOverrides
    type: boolean

stages:
  - template: image-bundle-run.stages.yaml
    parameters:
      testBundle: ${{ parameters.testBundle }}
      suites: ${{ parameters.suites }}
      images: ${{ parameters.images }}
      useImageOverrides: ${{ parameters.useImageOverrides }}
      companions:
        - ${{ each image in parameters.images }}:
          - ${{ if or(and(eq(parameters.testBundle, 'full'), or(in(image.value, '', '__use-default__'), eq(image.key, 'ipv6-hp-bpf'))), and(eq(parameters.testBundle, 'images'), in(image.value, '', '__use-default__'), containsValue(parameters.consumedImages, image.key))) }}:
            - ${{ image.key }}
