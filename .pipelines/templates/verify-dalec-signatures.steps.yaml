parameters:
  - name: images
    type: object

steps:
  - task: AzureCLI@2
    name: DalecSignatures
    displayName: Verify Dalec image and individual binary signatures
    inputs:
      azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        WORK="$(mktemp -d "$(Agent.TempDirectory)/dalec-signatures.XXXXXX")"
        trap 'rm -rf -- "$WORK"' EXIT
        export GOBIN="$WORK/bin" DOCKER_CONFIG="$WORK/docker"
        mkdir -p "$GOBIN" "$DOCKER_CONFIG"
        export PATH="$GOBIN:$PATH"
        go install github.com/google/go-containerregistry/cmd/crane@v0.21.3
        go install github.com/notaryproject/notation/cmd/notation@v1.3.2
        az acr login --name acnpublic --expose-token --query accessToken --output tsv |
          crane auth login acnpublic.azurecr.io \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin
        bash hack/scripts/verify-dalec-signatures.sh "$WORK/results.json"
        while IFS=$'\t' read -r parameter image; do
          echo "##vso[task.setvariable variable=verified_${parameter}]${image}"
        done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' "$WORK/results.json")
        echo "##vso[task.setvariable variable=dalecSignaturesVerified]true"
    env:
      DALEC_NOTATION_CONFIG: $(DALEC_NOTATION_CONFIG)
      DALEC_BINARY_VERIFIER: $(DALEC_BINARY_VERIFIER)
      ${{ each image in parameters.images }}:
        ${{ image.key }}: ${{ image.value }}
