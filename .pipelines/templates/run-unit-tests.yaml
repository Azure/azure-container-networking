stages:
  - stage: test
    displayName: Test ACN
    dependsOn:
      - setup
    jobs:
      - job: test
        displayName: Run Tests
        variables:
          STORAGE_ID: $[ stagedependencies.setup.env.outputs['EnvironmentalVariables.StorageID'] ]
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - script: |
              GO_VER=$(grep '^toolchain' go.mod | sed 's/toolchain go//' | cut -d. -f1,2)
              if [ -z "$GO_VER" ]; then GO_VER=$(grep '^go ' go.mod | awk '{print $2}' | cut -d. -f1,2); fi
              if [ -z "$GO_VER" ]; then echo "##[error]Failed to detect Go version from go.mod"; exit 1; fi
              echo "##vso[task.setvariable variable=GO_TOOLCHAIN_VERSION]$GO_VER"
            displayName: "Detect Go version from go.mod"
          - task: GoTool@0
            inputs:
              version: '$(GO_TOOLCHAIN_VERSION)'
            displayName: "Install Go"
          - script: |
              set -eo pipefail
              make tools

              test_exit=0
              sudo -E env "PATH=$PATH" make test-all 2>&1 | tee test-output.log || test_exit=$?
              report_exit=0
              build/tools/bin/go-junit-report < test-output.log > report.xml || report_exit=$?

              mv coverage-all.out linux-coverage.out

              if [ "$test_exit" -ne 0 ]; then exit "$test_exit"; fi
              exit "$report_exit"
            retryCountOnTaskFailure: 3
            name: "Test"
            displayName: "Run Tests"
          - task: PublishPipelineArtifact@1
            condition: succeededOrFailed()
            inputs:
              targetPath: 'linux-coverage.out'
              artifactName: 'linux-coverage'

  - stage: test_windows
    displayName: Test ACN Windows
    dependsOn:
      - setup
    jobs:
      - job: test
        displayName: Run Tests
        variables:
          STORAGE_ID: $[ stagedependencies.setup.env.outputs['EnvironmentalVariables.StorageID'] ]
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT_WINDOWS_ALT)"
        steps:
          - powershell: |
              $gomod = $null
              if (Test-Path "go.mod") { $gomod = "go.mod" }
              elseif (Test-Path "azure-container-networking/go.mod") { $gomod = "azure-container-networking/go.mod" }
              if ($gomod) {
                $toolchain = Select-String -Path $gomod -Pattern '^toolchain go(\d+\.\d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
              }
              if (-not $toolchain -and $gomod) { $toolchain = Select-String -Path $gomod -Pattern '^go (\d+\.\d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } }
              if (-not $toolchain) { Write-Error "Failed to detect Go version from go.mod"; exit 1 }
              Write-Host "##vso[task.setvariable variable=GO_TOOLCHAIN_VERSION]$toolchain"
              Write-Host "Detected Go version: $toolchain from $gomod"
            displayName: "Detect Go version from go.mod"
          - task: GoTool@0
            inputs:
              version: '$(GO_TOOLCHAIN_VERSION)'
            displayName: "Install Go"
          # Only run one go test per script
          - script: |
              go test -timeout 30m -covermode atomic -coverprofile=windows-coverage.out ./npm/... ./cni/... ./platform/...
              set "test_exit=%ERRORLEVEL%"
              go tool cover -func=windows-coverage.out
              set "coverage_exit=%ERRORLEVEL%"
              if not "%test_exit%"=="0" exit /b %test_exit%
              exit /b %coverage_exit%
            workingDirectory: '$(System.DefaultWorkingDirectory)'
            retryCountOnTaskFailure: 3
            name: "TestWindows"
            displayName: "Run Windows Tests"
          - task: PublishPipelineArtifact@1
            condition: succeededOrFailed()
            inputs:
              targetPath: 'windows-coverage.out'
              artifactName: 'windows-coverage'

  - ${{ if contains(variables['Build.SourceBranch'], 'master/pr') }}:
    - stage: code_coverage
      displayName: Code Coverage Check
      dependsOn:
        - test
      jobs:
        - job: coverage
          displayName: Check Coverage
          pool:
            name: "$(BUILD_POOL_NAME_DEFAULT)"
          steps:
            - script: |
                GO_VER=$(grep '^toolchain' go.mod | sed 's/toolchain go//' | cut -d. -f1,2)
                if [ -z "$GO_VER" ]; then GO_VER=$(grep '^go ' go.mod | awk '{print $2}' | cut -d. -f1,2); fi
                if [ -z "$GO_VER" ]; then echo "##[error]Failed to detect Go version from go.mod"; exit 1; fi
                echo "##vso[task.setvariable variable=GO_TOOLCHAIN_VERSION]$GO_VER"
              displayName: "Detect Go version from go.mod"
            - task: GoTool@0
              inputs:
                version: '$(GO_TOOLCHAIN_VERSION)'
              displayName: "Install Go"
            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: 'linux-coverage'
                path: './'
            - bash: |
                set -eo pipefail
                make tools

                GOOS=linux build/tools/bin/gocov convert linux-coverage.out > linux-coverage.json
                GOOS=linux build/tools/bin/gocov-xml < linux-coverage.json > linux-coverage.xml

                # TODO: Add windows coverage back in once PublishCodeCoverageResults v2 works with BuildQualityChecks

                mkdir -p coverage

                mv linux-coverage.xml coverage/
              name: "Coverage"
              displayName: "Generate Coverage Report"
              condition: always()

            - task: PublishCodeCoverageResults@1
              displayName: "Publish Code Coverage Report"
              condition: always()
              inputs:
                codeCoverageTool: 'Cobertura'
                summaryFileLocation: coverage/linux-coverage.xml
            - task: BuildQualityChecks@8
              displayName: "Check Code Coverage Regression"
              condition: always()
              inputs:
                checkCoverage: true
                coverageFailOption: "build"
                coverageType: "lines"
                fallbackOnPRTargetBranch: false
                baseBranchRef: "master"
                allowCoverageVariance: true
                coverageVariance: 0.25
