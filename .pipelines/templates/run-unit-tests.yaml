stages:
  - stage: test
    displayName: Test ACN
    dependsOn:
      - setup
    jobs:
      - job: test
        displayName: Run Tests
        variables:
          STORAGE_ID: $[ stagedependencies.setup.env.outputs['EnvironmentalVariables.StorageID'] ]
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
          os: linux
        templateContext:
          outputs:
            - output: pipelineArtifact
              targetPath: '$(System.DefaultWorkingDirectory)/linux-coverage.out'
              artifactName: 'linux-coverage'
              sbomEnabled: false
        steps:
          - script: |
              GO_VER=$(grep '^toolchain' go.mod | sed 's/toolchain go//' | cut -d. -f1,2)
              if [ -z "$GO_VER" ]; then GO_VER=$(grep '^go ' go.mod | awk '{print $2}' | cut -d. -f1,2); fi
              if [ -z "$GO_VER" ]; then echo "##[error]Failed to detect Go version from go.mod"; exit 1; fi
              echo "##vso[task.setvariable variable=GO_TOOLCHAIN_VERSION]$GO_VER"
            displayName: "Detect Go version from go.mod"
          - task: GoTool@0
            inputs:
              version: '$(GO_TOOLCHAIN_VERSION)'
            displayName: "Install Go"
          - script: |
              set -e
              # The NPM controller tests shell out to ipset and iptables. Ubuntu
              # agent images ship them; Azure Linux images do not, so install the
              # ones that are missing.
              if [ -f /etc/debian_version ]; then
                sudo apt-get update && sudo apt-get install -y ipset iptables
              else
                sudo tdnf install -y ipset iptables
              fi
              # Verify under sudo: ipset needs privileges to talk to the kernel,
              # which is how the tests invoke it.
              sudo ipset --version
              sudo iptables --version
            displayName: "Install netfilter test dependencies"
          - script: |
              set -e
              # Go 1.21+ is statically linked and cannot be observed directly
              # by CodeQL's LD_PRELOAD build tracer. A dynamic bash wrapper
              # makes the Go invocations in this task visible to the tracer.
              CODEQL_GO_SHIM_DIR="${AGENT_TEMPDIRECTORY:-/tmp}/codeql-go-tracing"
              mkdir -p "$CODEQL_GO_SHIM_DIR"
              REAL_GO=`command -v go`
              if [ -z "$REAL_GO" ]; then
                echo "##vso[task.logissue type=error]go toolchain not found on PATH; cannot install CodeQL Go tracing shim"
                exit 1
              fi
              cat > "$CODEQL_GO_SHIM_DIR/go" <<EOF
              #!/bin/bash
              exec "$REAL_GO" "\$@"
              EOF
              chmod 755 "$CODEQL_GO_SHIM_DIR/go"
              export PATH="$CODEQL_GO_SHIM_DIR:$PATH"
              echo "CodeQL Go tracing shim: $CODEQL_GO_SHIM_DIR/go -> $REAL_GO"

              # sudo's setuid boundary strips LD_PRELOAD before it starts.
              # Pass the tracer library back through env after elevation.
              SUDO_ENV=("PATH=$PATH")
              if [ -n "${LD_PRELOAD:-}" ]; then
                SUDO_ENV+=("LD_PRELOAD=$LD_PRELOAD")
              fi

              make bpf-lib
              go generate ./...
              make go-junit-report

              # run test, echo exit status code to fd 3, pipe output from test to tee, which splits output to stdout and go-junit-report (which converts test output to report.xml),
              # stdout from tee is redirected to fd 4. Take output written to fd 3 (which is the exit code of test), redirect to stdout, pipe to read from stdout then exit with that status code.
              # Read all output from fd 4 (output from tee) and write to top stdout
              { { { {
                    sudo -E env "${SUDO_ENV[@]}" make test-all;
                    echo $? >&3;
                    } | tee >($(go env GOPATH)/bin/go-junit-report > report.xml) >&4;
                  } 3>&1;
                } | { read xs; exit $xs; }
              } 4>&1

              # combine coverage from multiple modules
              (echo "mode: atomic"; tail -q -n +2 coverage-*.out) > coverage.cover
              mv coverage.cover linux-coverage.out
            retryCountOnTaskFailure: 3
            name: "Test"
            displayName: "Run Tests"

  - stage: test_windows
    displayName: Test ACN Windows
    dependsOn:
      - setup
    jobs:
      - job: test
        displayName: Run Tests
        variables:
          STORAGE_ID: $[ stagedependencies.setup.env.outputs['EnvironmentalVariables.StorageID'] ]
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT_WINDOWS_ALT)"
          # The pool serves two images and only v2.1 carries the 1ES PT
          # prerequisites, so pin it rather than letting the pool choose.
          image: acn-runner-vmss-image-windows-1es-v2.1
          os: windows
        templateContext:
          outputs:
            - output: pipelineArtifact
              targetPath: '$(System.DefaultWorkingDirectory)/windows-coverage.out'
              artifactName: 'windows-coverage'
              sbomEnabled: false
        steps:
          - powershell: |
              $gomod = $null
              if (Test-Path "go.mod") { $gomod = "go.mod" }
              elseif (Test-Path "azure-container-networking/go.mod") { $gomod = "azure-container-networking/go.mod" }
              if ($gomod) {
                $toolchain = Select-String -Path $gomod -Pattern '^toolchain go(\d+\.\d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
              }
              if (-not $toolchain -and $gomod) { $toolchain = Select-String -Path $gomod -Pattern '^go (\d+\.\d+)' | ForEach-Object { $_.Matches[0].Groups[1].Value } }
              if (-not $toolchain) { Write-Error "Failed to detect Go version from go.mod"; exit 1 }
              Write-Host "##vso[task.setvariable variable=GO_TOOLCHAIN_VERSION]$toolchain"
              Write-Host "Detected Go version: $toolchain from $gomod"
            displayName: "Detect Go version from go.mod"
          - task: GoTool@0
            inputs:
              version: '$(GO_TOOLCHAIN_VERSION)'
            displayName: "Install Go"
          # Only run one go test per script
          - script: |
              cd azure-container-networking/
              go test -timeout 30m -covermode atomic -coverprofile=windows-coverage.out ./cns/... ./npm/... ./cni/... ./platform/...
              go tool cover -func=windows-coverage.out
            retryCountOnTaskFailure: 3
            name: "TestWindows"
            displayName: "Run Windows Tests"

  - stage: code_coverage
    displayName: Code Coverage Check
    dependsOn:
      - setup
      - test
    jobs:
      - job: coverage
        displayName: Check Coverage
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
          os: linux
        steps:
          - script: |
              GO_VER=$(grep '^toolchain' go.mod | sed 's/toolchain go//' | cut -d. -f1,2)
              if [ -z "$GO_VER" ]; then GO_VER=$(grep '^go ' go.mod | awk '{print $2}' | cut -d. -f1,2); fi
              if [ -z "$GO_VER" ]; then echo "##[error]Failed to detect Go version from go.mod"; exit 1; fi
              echo "##vso[task.setvariable variable=GO_TOOLCHAIN_VERSION]$GO_VER"
            displayName: "Detect Go version from go.mod"
          - task: GoTool@0
            inputs:
              version: '$(GO_TOOLCHAIN_VERSION)'
            displayName: "Install Go"
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: 'linux-coverage'
              path: './'
          - bash: |
              # use go work to include multiple modules or gocov will omit results from those modules
              make workspace

              make tools
              sudo ln -s $(go env GOPATH)/bin/gocov /usr/local/bin/gocov
              sudo ln -s $(go env GOPATH)/bin/gocov-xml /usr/local/bin/gocov-xml

              GOOS=linux gocov convert linux-coverage.out > linux-coverage.json
              GOOS=linux gocov-xml < linux-coverage.json > linux-coverage.xml

              # TODO: Add windows coverage back in once PublishCodeCoverageResults v2 works with BuildQualityChecks

              mkdir coverage

              mv linux-coverage.xml coverage/
            name: "Coverage"
            displayName: "Generate Coverage Report"
            condition: always()

          - task: PublishCodeCoverageResults@1
            displayName: "Publish Code Coverage Report"
            condition: always()
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: coverage/linux-coverage.xml
          # Looking for PRs merging into master only
          - task: BuildQualityChecks@8
            displayName: "Check Code Coverage Regression"
            condition: eq(variables['System.PullRequest.targetBranchName'], 'master')
            inputs:
              checkCoverage: true
              coverageFailOption: "build"
              coverageType: "lines"
              fallbackOnPRTargetBranch: false
              baseBranchRef: "master"
              allowCoverageVariance: true
              coverageVariance: 0.25
