parameters:
  official: false

variables:
  - name: acnTestRef
    ${{ if eq(parameters.official, true) }}:
      value: $[ resources.repositories['azure-container-networking'].ref ]
    ${{ else }}:
      value: $[ coalesce(variables['System.PullRequest.TargetBranch'], variables['Build.SourceBranch']) ]
  # Default to running tests. A feature ref does not identify a release target.
  - name: RUN_NPM_TESTS
    value: >-
      $[ not(or(
        startsWith(variables.acnTestRef, 'release/v'),
        startsWith(variables.acnTestRef, 'refs/heads/release/v'),
        startsWith(variables.acnTestRef, 'refs/heads/gh-readonly-queue/release/v'),
        startsWith(variables.acnTestRef, 'refs/tags/v1.'),
        startsWith(variables.acnTestRef, 'refs/tags/azure-block-iptables/v'),
        startsWith(variables.acnTestRef, 'refs/tags/azure-ip-masq-merger/v'),
        startsWith(variables.acnTestRef, 'refs/tags/azure-ipam/v'),
        startsWith(variables.acnTestRef, 'refs/tags/azure-iptables-monitor/v'),
        startsWith(variables.acnTestRef, 'refs/tags/cilium-log-collector/v'),
        startsWith(variables.acnTestRef, 'refs/tags/cni-dropgz/v'),
        startsWith(variables.acnTestRef, 'refs/tags/dropgz/v'),
        startsWith(variables.acnTestRef, 'refs/tags/ipv6-hp-bpf/v'),
        startsWith(variables.acnTestRef, 'refs/tags/zapai/v'))) ]
