parameters:
  installFlag: "" # CNS scenario flag, for example INSTALL_AZURE_CNI_OVERLAY
  installerImage: "" # azure-cni or azure-ipam
  cniType: "" # CNI_TYPE for the load tests
  scaleup: ""

# Switches a running cluster from TCP IPAM to the CNS IPAM Unix socket while pods keep running.
# Image overrides can select releases that do not support the socket, so the steps run only for images built from source.
steps:
  - script: |
      set -e
      # The Makefile versions honor these variables, so unset them to get the versions built from source.
      expected_cns=$(env -u CNS_VERSION make cns-version)
      case "${{ parameters.installerImage }}" in
        azure-cni) installer=${CNI_VERSION:-} expected_installer=$(env -u CNI_VERSION make cni-version) ;;
        azure-ipam) installer=${AZURE_IPAM_VERSION:-} expected_installer=$(env -u AZURE_IPAM_VERSION make azure-ipam-version) ;;
        *) echo "unsupported installer image: ${{ parameters.installerImage }}" >&2; exit 1 ;;
      esac
      enabled=false
      if [ "${CNS_VERSION:-$expected_cns}" = "$expected_cns" ] && [ "${installer:-$expected_installer}" = "$expected_installer" ]; then
        enabled=true
      fi
      echo "CNS IPAM Unix socket E2E: $enabled"
      echo "##vso[task.setvariable variable=cnsUdsE2E]$enabled"
    name: "selectCNSUDS"
    displayName: "Select CNS IPAM Unix Socket E2E"

  - script: |
      set -e
      cd test/integration/load
      ITERATIONS=1 SCALE_UP=${{ parameters.scaleup }} OS_TYPE=linux CNI_TYPE=${{ parameters.cniType }} go test -count 1 -timeout 30m -tags load -run ^TestLoad$
      kubectl get pods -owide -n load-test
    condition: and(succeeded(), eq(variables['cnsUdsE2E'], 'true'))
    retryCountOnTaskFailure: 3
    name: "createPodsOverTCP"
    displayName: "Create Pods With CNS IPAM On TCP"

  - script: |
      set -e
      CNS=${CNS_VERSION:-$(make cns-version)}
      CNI=${CNI_VERSION:-$(make cni-version)}
      IPAM=${AZURE_IPAM_VERSION:-$(make azure-ipam-version)}
      sudo -E env "PATH=$PATH" make test-load CNS_ONLY=true INSTALL_CNS=true ${{ parameters.installFlag }}=true CNS_IPAM_UNIX_SOCKET_ENABLED=true OS_TYPE=linux CNI_TYPE=${{ parameters.cniType }} AZURE_IPAM_VERSION=${IPAM} CNS_VERSION=${CNS} CNI_VERSION=${CNI}
      bash hack/scripts/validate-cns-uds.sh
    condition: and(succeeded(), eq(variables['cnsUdsE2E'], 'true'))
    name: "enableCNSUDS"
    displayName: "Enable CNS IPAM Unix Socket"

  - script: |
      set -e
      echo "validate pods that were created over TCP"
      make test-validate-state OS_TYPE=linux CNI_TYPE=${{ parameters.cniType }}
      echo "replace the pods over the Unix socket"
      cd test/integration/load
      ITERATIONS=2 SCALE_UP=${{ parameters.scaleup }} OS_TYPE=linux CNI_TYPE=${{ parameters.cniType }} go test -count 1 -timeout 30m -tags load -run ^TestLoad$
      cd ../../..
      make test-validate-state OS_TYPE=linux CNI_TYPE=${{ parameters.cniType }}
      kubectl delete ns load-test
    condition: and(succeeded(), eq(variables['cnsUdsE2E'], 'true'))
    retryCountOnTaskFailure: 3
    name: "validatePodsOverUDS"
    displayName: "Validate Pods After Enabling CNS IPAM Unix Socket"
