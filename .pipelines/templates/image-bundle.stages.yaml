stages:
  - template: image-bundle-companions.stages.yaml
    parameters:
      testBundle: ${{ parameters.testBundle }}
      images: ${{ parameters.images }}
      suites:
        - ${{ each suite in parameters.suites }}:
          - ${{ if or(eq(parameters.testBundle, 'full'), and(notIn(parameters.images['cni'], '', '__use-default__'), containsValue(suite.images, 'cni')), and(notIn(parameters.images['cns'], '', '__use-default__'), containsValue(suite.images, 'cns')), and(notIn(parameters.images['azure-ipam'], '', '__use-default__'), containsValue(suite.images, 'azure-ipam')), and(notIn(parameters.images['azure-iptables-monitor'], '', '__use-default__'), containsValue(suite.images, 'azure-iptables-monitor')), and(notIn(parameters.images['azure-ip-masq-merger'], '', '__use-default__'), containsValue(suite.images, 'azure-ip-masq-merger')), and(notIn(parameters.images['cilium-log-collector'], '', '__use-default__'), containsValue(suite.images, 'cilium-log-collector')), and(notIn(parameters.images['ipv6-hp-bpf'], '', '__use-default__'), containsValue(suite.images, 'ipv6-hp-bpf'))) }}:
            - ${{ suite }}
