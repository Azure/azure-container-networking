steps:
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
      scriptLocation: inlineScript
      scriptType: bash
      inlineScript: |
        cd hack/scripts
        chmod +x cilium-mtu-validation.sh
        ./cilium-mtu-validation.sh
    name: "CiliumMTUValidation"
    displayName: "Run Cilium MTU Validation"