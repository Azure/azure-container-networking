name: Backport merged pull request

on:
  pull_request_target:
    branches:
      - master
    types:
      - closed
      - labeled

permissions: {}

jobs:
  backport:
    name: Create backport issues
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'needs-backport') &&
      (
        github.event.action == 'closed' ||
        github.event.label.name == 'needs-backport' ||
        startsWith(github.event.label.name, 'release/')
      )
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    concurrency:
      group: backport-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Create backport issues
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          REPO: ${{ github.repository }}
          SOURCE_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          SOURCE_PULL_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_PULL_TITLE: ${{ github.event.pull_request.title }}
          SOURCE_PULL_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          mapfile -t TARGET_BRANCHES < <(
            jq -r '
              .[]
              | capture("^release/v?(?<version>[0-9]+\\.[0-9]+)$")
              | "release/v\(.version)"
            ' <<< "$LABELS_JSON" | sort -u
          )

          if [[ ${#TARGET_BRANCHES[@]} -eq 0 ]]; then
            echo "::notice::No release/X.Y labels found; no backport issue will be created."
            exit 0
          fi

          for target_branch in "${TARGET_BRANCHES[@]}"; do
            if ! gh api --silent "/repos/$REPO/git/ref/heads/$target_branch"; then
              echo "::error::Backport target branch '$target_branch' does not exist."
              exit 1
            fi

            marker="backport-agent:${SOURCE_PULL_NUMBER}:${target_branch}"

            existing_pull=$(gh pr list \
              --repo "$REPO" \
              --state all \
              --base "$target_branch" \
              --search "\"Backport of #${SOURCE_PULL_NUMBER}\" in:body" \
              --json number \
              --jq '.[0].number // empty')
            if [[ -n "$existing_pull" ]]; then
              echo "::notice::Backport PR #$existing_pull already targets $target_branch; skipping."
              continue
            fi

            existing_issue=$(gh api \
              "/repos/$REPO/issues?state=all&per_page=100&sort=created&direction=desc" \
              --jq '
                .[]
                | select(
                    .pull_request == null and
                    ((.body // "") | contains("<!-- '"$marker"' -->"))
                  )
                | {number, state: (.state | ascii_upcase), url: .html_url}
              ' | head -1)

            if [[ -z "$existing_issue" ]]; then
              existing_issue=$(gh issue list \
                --repo "$REPO" \
                --state all \
                --search "\"$marker\" in:body" \
                --json number,state,url \
                --jq '.[0] // empty')
            fi

            if [[ -n "$existing_issue" ]]; then
              issue_number=$(jq -r '.number' <<< "$existing_issue")
              issue_state=$(jq -r '.state' <<< "$existing_issue")
              if [[ "$issue_state" == "CLOSED" ]]; then
                echo "::notice::Backport issue #$issue_number is closed; skipping."
              else
                echo "::notice::Backport issue #$issue_number is already open; skipping."
              fi
              continue
            else
              issue_body=$(cat <<EOF
          ## Automated backport request

          | Input | Value |
          | --- | --- |
          | Source PR | $SOURCE_PULL_URL |
          | Source PR number | \`#$SOURCE_PULL_NUMBER\` |
          | Source merge commit | \`$SOURCE_MERGE_SHA\` |
          | Source branch | \`master\` |
          | Target branch | \`$target_branch\` |

          ### Instructions for Copilot

          Use the \`acn-backport\` skill in \`.github/skills/acn-backport/SKILL.md\`.
          Backport source PR #$SOURCE_PULL_NUMBER to \`$target_branch\`. Preserve the
          source change exactly when it applies cleanly. If conflicts occur, adapt only
          what is required by the target branch and follow the skill's validation and
          stop conditions.

          The pull request must target \`$target_branch\`, be titled
          \`[Backport $target_branch] $SOURCE_PULL_TITLE\`, and include
          \`Backport of #$SOURCE_PULL_NUMBER\` in its body.

          ### Maintainer action required

          Assign this issue to Copilot and select \`$target_branch\` as the base branch.
          Do not use the repository default branch.

          ---
          <!-- $marker -->
          EOF
              )

              gh label create "Agent-Generated" \
                --repo "$REPO" \
                --description "Created by automation" \
                --color "ededed" 2>/dev/null || true

              issue_url=$(gh issue create \
                --repo "$REPO" \
                --title "[Backport $target_branch] $SOURCE_PULL_TITLE" \
                --body "$issue_body" \
                --label "Agent-Generated")
              issue_number=${issue_url##*/}
            fi

            echo "::notice::Created $issue_url for manual Copilot assignment to $target_branch."
          done
