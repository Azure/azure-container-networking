name: Check Dalec template handoff

on:
  pull_request:
    paths:
      - .github/scripts/prepare-dalec.py
      - .github/scripts/test_prepare_dalec.py
      - .github/workflows/create-release-tag.yml
      - .github/workflows/dalec-template-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p test_prepare_dalec.py
