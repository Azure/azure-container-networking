---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: uvmnetworkconfigs.multitenancy.acn.azure.com
spec:
  group: multitenancy.acn.azure.com
  names:
    kind: UVMNetworkConfig
    listKind: UVMNetworkConfigList
    plural: uvmnetworkconfigs
    shortNames:
    - uvmnc
    singular: uvmnetworkconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backendNetwork.name
      name: BackendNetwork
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: "UVMNetworkConfig is the Schema for the UVMNetworkConfig API.\n\nIt
          represents tenant-level InfiniBand (IB) programming intent for a node/UVM,\ndecoupled
          from pod lifecycle. One UVMNetworkConfig exists per node/UVM and\ncovers
          all IB NICs on that node - see the design invariant:\n\n\tone node -> one
          UVM -> one backend network -> all IB NICs on that node\n\nThe CRD is created
          by the tenant-aware scheduler when the first tenant\nworkload is placed
          onto a UVM, and deleted when the tenant/UVM lifecycle\nends. DNC-RC reconciles
          it using the existing NC create/delete plumbing;\npod create/delete events
          must never affect it."
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              UVMNetworkConfigSpec defines the desired state of UVMNetworkConfig.

              Note: partitionKey is deliberately not expressed here. PKey allocation is
              owned by NSM and is an implementation detail of the fabric programming
              layer, not a tenant-supplied input. It may be surfaced in status for
              observability.
            properties:
              backendNetwork:
                description: |-
                  BackendNetwork is the single backend network associated with all IB
                  NICs on this node.
                properties:
                  name:
                    description: |-
                      Name of the backend network. Must be non-empty: DNC-RC enumerates and
                      programs the node's IB NICs against this backend network, so an empty
                      name would otherwise silently reach the fabric-programming layer.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - backendNetwork
            type: object
          status:
            description: UVMNetworkConfigStatus defines the observed state of UVMNetworkConfig.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  UVMNetworkConfig's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastUpdated:
                description: LastUpdated is the last time the status was updated.
                format: date-time
                type: string
              state:
                description: State is the overall IB programming state for this node/UVM.
                enum:
                - Pending
                - Programming
                - Programmed
                - Deleting
                - Failed
                type: string
              ufmPartition:
                description: UFMPartition reports the UFM partition programming status.
                properties:
                  backendNetwork:
                    description: BackendNetwork is the backend network this UFM partition
                      status applies to.
                    type: string
                  state:
                    description: State is the UFM partition state (e.g. Active).
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
