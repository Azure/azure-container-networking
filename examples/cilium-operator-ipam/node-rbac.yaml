apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-cilium-ipam-worker-1
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: azure-cilium-ipam-worker-1
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    resourceNames: ["worker-1"]
    verbs: ["get"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnodes"]
    resourceNames: ["worker-1"]
    verbs: ["get"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnodes/status"]
    resourceNames: ["worker-1"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: azure-cilium-ipam-worker-1
subjects:
  - kind: ServiceAccount
    name: azure-cilium-ipam-worker-1
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: azure-cilium-ipam-worker-1
