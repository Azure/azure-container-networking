# Instantiate separately per node. Create cannot be scoped by resourceNames;
# enforce the corresponding node name/owner/consumer through admission policy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: azure-vnet-ipam-NODE_NAME
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: azure-vnet-ipam-NODE_NAME
rules:
  - apiGroups: [""]
    resources: [nodes]
    resourceNames: [NODE_NAME]
    verbs: [get]
  - apiGroups: [cilium.io]
    resources: [ciliumnodes]
    resourceNames: [NODE_NAME]
    verbs: [get, watch]
  - apiGroups: [cilium.io]
    resources: [ciliumnodes]
    verbs: [create]
  - apiGroups: [cilium.io]
    resources: [ciliumnodes/status]
    resourceNames: [NODE_NAME]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: azure-vnet-ipam-NODE_NAME
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: azure-vnet-ipam-NODE_NAME
subjects:
  - kind: ServiceAccount
    name: azure-vnet-ipam-NODE_NAME
    namespace: kube-system
